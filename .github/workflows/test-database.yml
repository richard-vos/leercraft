name: Database-initialisatie testen
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: leercraft-ci-only
          MARIADB_DATABASE: leercraft_ci_test
          MARIADB_USER: leercraft_ci
          MARIADB_PASSWORD: leercraft-ci-user-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql
      - name: PHP-syntax controleren
        run: find api tests spellen winkel -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Spel-startpaginas controleren
        run: php tests/game-routes.php
      - name: OTP-invoer en spellogica controleren
        run: |
          node tests/account-otp.cjs
          node tests/province-game.cjs
          node tests/province-write-game.cjs
          node --experimental-default-type=module tests/rekencraft-visuals.cjs
          node --experimental-default-type=module tests/rekencraft-progress.cjs
          node --experimental-default-type=module tests/getallenzee-progress.cjs
          node --experimental-default-type=module tests/avatar-cosmetics.cjs
      - name: Puntentoekenning controleren
        run: php tests/game-scores.php
      - name: Configuratie voor gast-accounttest maken
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: leercraft_ci_test
          DB_USER: leercraft_ci
          DB_PASS: leercraft-ci-user-only
          OTP_PEPPER: leercraft-ci-only-pepper-not-for-production
        run: python3 scripts/build-server-config.py api/config.php
      - name: Automatische initialisatie op MariaDB 11.8 testen
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: leercraft_ci_test
          TEST_DB_USER: leercraft_ci
          TEST_DB_PASS: leercraft-ci-user-only
        run: php tests/database-bootstrap.php
      - name: Account- en punten-API samen testen
        run: |
          php -S 127.0.0.1:8093 -t . > /tmp/leercraft-api-tests.log 2>&1 &
          php -r 'for($i=0;$i<30;$i++){ $s=@fsockopen("127.0.0.1",8093); if($s){fclose($s);exit(0);} usleep(100000);} exit(1);'
          php tests/scores-api.php
          php tests/shop-api.php
