name: Deploy naar STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: strato-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-check:
    uses: ./.github/workflows/test-database.yml

  deploy:
    needs: database-check
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: Beschikbaarheid van deployment-secrets controleren
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          SFTP_KNOWN_HOSTS: ${{ secrets.STRATO_SFTP_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          print('Repository:', os.environ['GITHUB_REPOSITORY'])
          print('Commit:', os.environ['GITHUB_SHA'])
          names = ('DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASS', 'OTP_PEPPER', 'SFTP_KNOWN_HOSTS')
          missing = []
          for name in names:
              label = 'STRATO_SFTP_KNOWN_HOSTS' if name == 'SFTP_KNOWN_HOSTS' else name
              present = bool(os.environ.get(name))
              print(label + ': ' + ('beschikbaar' if present else 'ONTBREEKT'))
              if not present:
                  missing.append(label)
          if missing:
              sys.exit('Niet beschikbare repository-secrets: ' + ', '.join(missing))
          PY

      - name: Benodigdheden installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client rsync

      - name: Websitebestanden voorbereiden
        run: |
          mkdir -p /tmp/leercraft-deploy

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".gitlab-ci.yml" \
            --exclude="api/config.php" \
            --exclude="data/visitor-count.json" \
            --exclude=".claude/" \
            --exclude=".codex/" \
            --exclude=".agents/" \
            --exclude=".tmp/" \
            --exclude="scripts/" \
            --exclude="tests/" \
            --exclude="__pycache__/" \
            ./ /tmp/leercraft-deploy/

      - name: Serverconfiguratie maken met GitHub secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python3 scripts/build-server-config.py /tmp/leercraft-deploy/api/config.php

      - name: SSH-hostsleutel toevoegen
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_KNOWN_HOSTS: ${{ secrets.STRATO_SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          test -n "$SFTP_KNOWN_HOSTS" || { echo 'Secret STRATO_SFTP_KNOWN_HOSTS ontbreekt'; exit 1; }
          printf '%s\n' "$SFTP_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          lookup="$SFTP_HOST"
          if [ "$SFTP_PORT" != "22" ]; then
            lookup="[$SFTP_HOST]:$SFTP_PORT"
          fi
          if ! ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts > /tmp/leercraft-matched-hostkeys; then
            echo 'STRATO_SFTP_KNOWN_HOSTS bevat geen sleutel voor STRATO_SFTP_HOST en STRATO_SFTP_PORT.'
            echo 'Gebruik de volledige known_hosts-regel voor exact dezelfde servernaam en poort, niet alleen de fingerprint.'
            exit 1
          fi
          if ! ssh-keygen -l -f /tmp/leercraft-matched-hostkeys > /dev/null 2>&1; then
            echo 'De passende known_hosts-regel bevat geen geldige openbare SSH-hostsleutel.'
            exit 1
          fi
          echo 'Geldige hostsleutel gevonden voor de ingestelde SFTP-host en poort.'

      - name: Website uploaden naar STRATO
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SSHPASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.STRATO_REMOTE_PATH }}
        run: |
          sshpass -e sftp \
            -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=yes \
            -o PasswordAuthentication=yes \
            -o PreferredAuthentications=keyboard-interactive,password \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$SFTP_PORT" \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          cd "$REMOTE_PATH"
          put -r /tmp/leercraft-deploy/*
          put /tmp/leercraft-deploy/.htaccess .htaccess
          put /tmp/leercraft-deploy/api/.htaccess api/.htaccess
          put /tmp/leercraft-deploy/api/lib/.htaccess api/lib/.htaccess
          put /tmp/leercraft-deploy/data/.htaccess data/.htaccess
          bye
          EOF

      - name: Alle publieke spelroutes na upload controleren
        run: |
          python3 - <<'PY'
          import urllib.request
          import json
          from pathlib import Path
          entries = sorted(Path('spellen').rglob('index.php'))
          if not entries:
              raise SystemExit('Geen spelpaginas gevonden voor de routecontrole.')
          for entry in entries:
              url = 'https://leercraft.nl/' + entry.parent.as_posix() + '/'
              with urllib.request.urlopen(url, timeout=30) as response:
                  html = response.read().decode('utf-8')
                  if response.status != 200 or '<title>' not in html or '<?php' in html:
                      raise SystemExit('Spelroute levert geen spelpagina op: ' + entry.parent.name)
              print('Spelroute bereikbaar: ' + entry.parent.name)
          with urllib.request.urlopen('https://leercraft.nl/winkel/', timeout=30) as response:
              if 'id="shop-catalog"' not in response.read().decode('utf-8'):
                  raise SystemExit('Winkelpagina ontbreekt.')
          # Guest account lookup initializes missing tables only inside DB_NAME.
          with urllib.request.urlopen('https://leercraft.nl/api/auth/me.php', timeout=30) as response:
              if not json.load(response).get('ok'):
                  raise SystemExit('Accountservice of database-initialisatie mislukt.')
          with urllib.request.urlopen('https://leercraft.nl/api/shop/state.php', timeout=30) as response:
              state = json.load(response)
              if not state.get('ok') or not state.get('catalog') or state.get('loggedIn'):
                  raise SystemExit('Winkel-API werkt niet correct voor gasten.')
              for slot in ['head', 'shoes', 'shirt', 'pants', 'object']:
                  if sum(item['slot'] == slot for item in state['catalog']) != 20:
                      raise SystemExit('Winkelcategorie bevat niet 20 items: ' + slot)
          PY

      - name: Vervallen spelbestanden opruimen na geslaagde routecontrole
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SSHPASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.STRATO_REMOTE_PATH }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          remote = os.environ['REMOTE_PATH']
          if any(c in remote for c in '\r\n'):
              raise SystemExit('Ongeldige doelmap.')
          quoted = remote.replace('\\', '\\\\').replace('"', '\\"')
          commands = Path('scripts/cleanup-legacy-games.sftp').read_text()
          Path('/tmp/leercraft-cleanup.sftp').write_text('cd "' + quoted + '"\n' + commands + '\nbye\n')
          PY
          # Set BatchMode before -b: OpenSSH uses the first value, and -b adds BatchMode=yes.
          # Keep password authentication identical to the successful upload connection.
          sshpass -e sftp \
            -o BatchMode=no \
            -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=yes \
            -o PasswordAuthentication=yes \
            -o PreferredAuthentications=keyboard-interactive,password \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -b /tmp/leercraft-cleanup.sftp \
            -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST"

      - name: Tijdelijke serverconfiguratie opruimen
        if: always()
        run: rm -f /tmp/leercraft-deploy/api/config.php
