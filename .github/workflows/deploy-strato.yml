name: Deploy naar STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: strato-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: SFTP-tools installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Websitebestanden voorbereiden
        run: |
          mkdir -p /tmp/leercraft-deploy

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".gitlab-ci.yml" \
            ./ /tmp/leercraft-deploy/

      - name: Website uploaden naar STRATO
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SSHPASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.STRATO_REMOTE_PATH }}
        run: |
          sshpass -e sftp \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o StrictHostKeyChecking=accept-new \
            -P "$SFTP_PORT" \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          cd "$REMOTE_PATH"
          put -r /tmp/leercraft-deploy/*
          bye
          EOF