name: STRATO SFTP-test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: Benodigdheden installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client

      - name: SFTP-verbinding testen
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SSHPASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          sshpass -v -e sftp -vvv \
            -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=yes \
            -o PasswordAuthentication=yes \
            -o PreferredAuthentications=keyboard-interactive,password \
            -o StrictHostKeyChecking=yes \
            -P "$SFTP_PORT" \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          pwd
          bye
          EOF