<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nederland Schrijfspel</title>
<link href="../../assets/fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#5DA9E9;font-family:'Press Start 2P',monospace;min-height:100vh;overflow-x:hidden;}
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#87CEEB 0%,#B8DEFF 54%,#6DB355 54%,#4A9A2A 100%);z-index:0;}
.cloud{position:fixed;background:white;z-index:1;opacity:0.9;}
.wrapper{position:relative;z-index:10;max-width:980px;margin:0 auto;padding:12px 12px 60px;}

.header{background:rgba(0,0,0,0.72);border:4px solid #555;border-bottom-color:#333;border-right-color:#333;border-top-color:#888;border-left-color:#888;padding:12px 18px;margin-bottom:12px;text-align:center;}
h1{font-size:clamp(9px,2vw,15px);color:#FFD700;text-shadow:3px 3px #7A5A00;line-height:1.7;}
h1 small{display:block;font-size:0.65em;color:#aaffaa;text-shadow:2px 2px #006600;margin-top:4px;}

.score-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.sc-block,.xp-wrap{background:rgba(0,0,0,0.72);border:3px solid #666;border-bottom-color:#333;border-right-color:#333;padding:8px 12px;}
.sc-block{flex:1;min-width:100px;}
.xp-wrap{flex:2;min-width:160px;}
.sc-label,.xp-lbl{font-size:6px;color:#aaa;margin-bottom:4px;}
.sc-val{font-size:13px;color:#FFD700;text-shadow:2px 2px #7A5A00;}
.xp-track{background:#333;height:10px;border:2px solid #555;overflow:hidden;}
.xp-fill{height:100%;background:#7CFC00;transition:width 0.4s;box-shadow:0 0 4px #7CFC00;}

.game-area{display:grid;grid-template-columns:1fr 270px;gap:10px;align-items:start;}
@media(max-width:680px){.game-area{grid-template-columns:1fr;}}

.map-panel{background:rgba(0,0,0,0.65);border:4px solid #666;border-bottom-color:#333;border-right-color:#333;padding:8px;}
.map-title{font-size:6px;color:#aaa;text-align:center;margin-bottom:6px;letter-spacing:1px;}

/* SVG overflow visible zodat de pop-animatie niet wordt afgeknipt */
#map-svg{width:100%;height:auto;display:block;background:#c5dff5;border:2px solid #4477aa;overflow:visible;}

/* Provincie paths */
.prov-path{transition:fill 0.25s;}

/* Alle animaties ALLEEN via filter — geen transform op het <g>
   zodat transform-origin nooit het probleem is */
.prov{transition:filter 0.25s;}

/* Active: goud + opveren via filter-pulse (geen translate) */
@keyframes filterPop{
  0%  { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
  35% { filter: brightness(1.15) drop-shadow(0 6px 18px rgba(0,0,0,0.55))
               drop-shadow(0 0 22px #FFD700) drop-shadow(0 0 44px #FFD70099); }
  65% { filter: brightness(1.1)  drop-shadow(0 5px 14px rgba(0,0,0,0.5))
               drop-shadow(0 0 16px #FFD700); }
  100%{ filter: brightness(1.08) drop-shadow(0 4px 12px rgba(0,0,0,0.45))
               drop-shadow(0 0 12px #FFD700); }
}
@keyframes filterShake{
  0%,100%{ filter: brightness(1.08) drop-shadow(0 4px 12px rgba(0,0,0,0.45))
                   drop-shadow(0 0 12px #FFD700); }
  25%    { filter: brightness(0.9)  drop-shadow(-4px 4px 12px rgba(255,60,60,0.7))
                   drop-shadow(0 0 10px #ff4444); }
  75%    { filter: brightness(0.9)  drop-shadow(4px 4px 12px rgba(255,60,60,0.7))
                   drop-shadow(0 0 10px #ff4444); }
}
@keyframes filterCorrect{
  0%  { filter: brightness(1.08) drop-shadow(0 4px 12px rgba(0,0,0,0.45))
               drop-shadow(0 0 12px #FFD700); }
  40% { filter: brightness(1.4)  drop-shadow(0 8px 24px rgba(0,0,0,0.5))
               drop-shadow(0 0 36px #00ff00) drop-shadow(0 0 60px #00ff0066); }
  100%{ filter: brightness(1.0)  drop-shadow(0 3px 5px rgba(0,0,0,0.3)); }
}

.prov.is-active  { animation: filterPop   0.45s ease-out forwards; }
.prov.is-wrong   { animation: filterShake 0.4s  ease-out forwards; }
.prov.is-correct { animation: filterCorrect 0.7s ease-out forwards; }
.prov.is-done    { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

/* SIDE PANEL */
.side{display:flex;flex-direction:column;gap:8px;}
.type-section{background:rgba(0,0,0,0.8);border:4px solid #888;border-bottom-color:#444;border-right-color:#444;padding:14px 12px;}
.type-prompt{font-size:7px;color:#ccc;margin-bottom:10px;line-height:1.9;text-align:center;}
.type-prompt span{color:#FFD700;}
.attempts{display:flex;gap:5px;justify-content:center;margin-bottom:10px;}
.attempt-dot{width:12px;height:12px;border:2px solid #666;background:rgba(255,255,255,0.1);}
.attempt-dot.used{background:#cc3333;border-color:#ff4444;box-shadow:0 0 4px #ff4444;}
.letter-hint{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;min-height:26px;}
.lb{width:18px;height:22px;border-bottom:2px solid #666;font-size:10px;color:#888;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;transition:all 0.1s;}
.lb.sp{width:10px;border-bottom-color:transparent;}
.lb.ok{color:#7CFC00;border-color:#7CFC00;text-shadow:0 0 6px #7CFC00;}
.lb.no{color:#ff4444;border-color:#ff4444;}
#prov-input{font-family:'Press Start 2P',monospace;font-size:11px;width:100%;padding:10px 12px;background:#0a0a1a;color:#fff;border:3px solid #444;border-bottom-color:#222;border-right-color:#222;border-top-color:#777;border-left-color:#777;outline:none;caret-color:#FFD700;letter-spacing:1px;transition:border-color 0.2s,box-shadow 0.2s;}
#prov-input:focus{border-color:#FFD700;box-shadow:0 0 10px rgba(255,215,0,0.4);}
#prov-input.ok{border-color:#00cc00;box-shadow:0 0 10px rgba(0,255,0,0.4);background:#001200;color:#7CFC00;}
#prov-input.no{border-color:#cc0000;box-shadow:0 0 10px rgba(255,0,0,0.3);animation:inputShake 0.35s;}
@keyframes inputShake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}}
.btn-row{display:flex;gap:6px;margin-top:8px;}
.mc-btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px;background:#5D9E3A;color:white;text-shadow:2px 2px #2A5A18;border:none;border-bottom:4px solid #2A5A18;border-right:4px solid #2A5A18;border-top:4px solid #8ADE5A;border-left:4px solid #8ADE5A;cursor:pointer;width:100%;transition:transform 0.1s;}
.mc-btn:hover{filter:brightness(1.15);}
.mc-btn:active{transform:translateY(2px);border-bottom-width:2px;}
.mc-btn.hint-btn{background:#8B6914;border-bottom-color:#4A3A08;border-right-color:#4A3A08;border-top-color:#C8A040;border-left-color:#C8A040;color:#FFD700;text-shadow:1px 1px #4A3A08;flex:0 0 80px;font-size:7px;}
.mc-btn.red{background:#C85A20;border-bottom-color:#7A2A08;border-right-color:#7A2A08;border-top-color:#F07A40;border-left-color:#F07A40;text-shadow:2px 2px #7A2A08;}
.feedback{background:rgba(0,0,0,0.8);border:3px solid #555;padding:10px 8px;font-size:6.5px;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:2;color:#888;transition:border-color 0.3s,color 0.3s;}
.feedback.ok{border-color:#00bb00;color:#aaffaa;}
.feedback.no{border-color:#cc0000;color:#ffaaaa;}
.feedback.hint{border-color:#FFD700;color:#FFD700;}
.prov-list{background:rgba(0,0,0,0.65);border:3px solid #555;border-bottom-color:#333;border-right-color:#333;padding:8px;}
.prov-list-title{font-size:6px;color:#777;text-align:center;margin-bottom:6px;}
.chips{display:flex;flex-wrap:wrap;gap:3px;}
.chip{font-family:'Press Start 2P',monospace;font-size:5px;padding:3px 5px;border:2px solid #555;background:rgba(255,255,255,0.07);color:#bbb;}
.chip.done{background:rgba(0,180,0,0.25);border-color:#00cc00;color:#aaffaa;}
.chip.missed{background:rgba(180,0,0,0.2);border-color:#cc0000;color:#ffaaaa;}
.end-screen{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;}
.end-screen.show{display:flex;}
.end-title{font-size:clamp(13px,3vw,20px);color:#FFD700;text-shadow:3px 3px #7A5A00;line-height:1.6;}
.end-score{font-size:clamp(22px,5vw,36px);color:white;text-shadow:3px 3px #333;}
.end-msg{font-size:8px;color:#aaa;max-width:380px;line-height:1.9;}
.particle{position:fixed;width:8px;height:8px;pointer-events:none;z-index:300;animation:fall 1.2s ease-in forwards;}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(90px) rotate(200deg);}}
</style>

  if(p) p.setAttribute('fill', color);
}

/* Zet CSS-klasse met force-reflow zodat animatie herstart */
function setAnim(pid, cls){
  const el=document.getElementById(pid);
  if(!el) return;
  el.classList.remove('is-active','is-wrong','is-correct','is-done');
  void el.offsetWidth; // reflow
  if(cls) el.classList.add(cls);
}

function startGame(){
  queue=shuffle(PROVINCES); score=0; wrong=0; round=0; attempts=0; answered=false; done={};
  document.getElementById('end-screen').classList.remove('show');
  buildChips();
  PROVINCES.forEach(p=>{ setFill(p.id, DIM); setAnim(p.id, null); });
  nextRound();
}

function buildChips(){
  const w=document.getElementById('chips'); w.innerHTML='';
  PROVINCES.forEach(p=>{
    const c=document.createElement('div');
    c.className='chip'; c.id='chip-'+p.id; c.textContent=p.name; w.appendChild(c);
  });
}

function updateBar(){
  document.getElementById('score-disp').textContent=score;
  document.getElementById('wrong-disp').textContent=wrong;
  document.getElementById('round-disp').textContent=round+' / '+PROVINCES.length;
  document.getElementById('xp-fill').style.width=(round/PROVINCES.length*100)+'%';
}

function updateDots(){
  for(let i=0;i<MAX_ATTEMPTS;i++){
    const d=document.getElementById('dot'+i);
    if(d) d.classList.toggle('used', i<attempts);
  }
}

function buildLetterHint(typed){
  const row=document.getElementById('letter-hint');
  row.innerHTML='';
  if(!current) return;
  const target=current.name;
  for(let i=0;i<target.length;i++){
    const ch=target[i];
    const div=document.createElement('div');
    if(ch===' '){
      div.className='lb sp'; div.textContent=' ';
    }else{
      div.className='lb';
      const tc=typed[i]||'';
      if(tc){ div.textContent=tc; div.classList.add(tc===ch?'ok':'no'); }
    }
    row.appendChild(div);
  }
}

function setFeedback(msg, type){
  const fb=document.getElementById('feedback');
  fb.textContent=msg;
  fb.className='feedback'+(type?' '+type:'');
}

function nextRound(){
  answered=false; attempts=0; updateDots();
  const inp=document.getElementById('prov-input');
  inp.value=''; inp.disabled=false; inp.className=''; inp.placeholder='Typ hier...';
  buildLetterHint('');
  setFeedback('De gele provincie springt op — typ de naam!','');

  if(!queue.length){ endGame(); return; }
  current=queue.shift(); round++;
  updateBar();

  // Reset alle provincies
  PROVINCES.forEach(p=>{
    if(done[p.id]){
      setFill(p.id, p.color);
      setAnim(p.id, 'is-done');
    }else{
      setFill(p.id, DIM);
      setAnim(p.id, null);
    }
  });

  // Highlight actieve provincie: goud + pop-animatie
  setFill(current.id, GOLD);
  setAnim(current.id, 'is-active');

  setTimeout(()=>inp.focus(), 50);
}

document.getElementById('prov-input').addEventListener('input', function(){
  buildLetterHint(this.value);
});
document.getElementById('prov-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') submitAnswer();
});

function submitAnswer(){
  if(answered||!current) return;
  const inp=document.getElementById('prov-input');
  const typed=inp.value.trim();

  if(!typed){
    setFeedback('⚠️ Typ eerst een antwoord!','hint');
    inp.focus(); return;
  }

  if(typed===current.name){
    // ✅ CORRECT
    answered=true; score++;
    done[current.id]=true;
    inp.className='ok'; inp.disabled=true;

    setFill(current.id, current.color);
    setAnim(current.id, 'is-correct');

    const chip=document.getElementById('chip-'+current.id);
    if(chip) chip.classList.add('done');

    setFeedback('✅ Juist! '+current.name+' 🎉','ok');
    spawnParticles('#7CFC00');
    updateBar();
    setTimeout(nextRound, 1500);

  }else{
    // ❌ FOUT
    attempts++; updateDots();
    inp.className='no';
    setAnim(current.id, 'is-wrong');

    setTimeout(()=>{
      inp.className='';
      inp.value='';
      buildLetterHint('');
      // Terug naar active staat na shake
      setFill(current.id, GOLD);
      setAnim(current.id, 'is-active');
      inp.focus();
    }, 420);

    if(attempts>=MAX_ATTEMPTS){
      answered=true; wrong++;
      done[current.id]=true;
      inp.disabled=true;

      // Zet juiste kleur na kort delay (wacht op shake animatie)
      setTimeout(()=>{
        setFill(current.id, current.color);
        setAnim(current.id, 'is-done');
      }, 420);

      const chip=document.getElementById('chip-'+current.id);
      if(chip) chip.classList.add('missed');

      setFeedback('❌ Het was: '+current.name,'no');
      updateBar();
      setTimeout(nextRound, 2500);
    }else{
      const left=MAX_ATTEMPTS-attempts;
      if(typed.toLowerCase()===current.name.toLowerCase()){
        setFeedback('🔤 Let op de hoofdletter(s)! Nog '+left+' poging'+(left===1?'':'en')+'.','hint');
      }else{
        setFeedback('❌ Niet juist. Nog '+left+' poging'+(left===1?'':'en')+'.','no');
      }
    }
  }
}

function showHint(){
  if(answered||!current) return;
  const n=current.name;
  const rev=Math.ceil(n.replace(/ /g,'').length/3);
  let shown=0, hint='';
  for(let i=0;i<n.length;i++){
    if(n[i]===' '){ hint+=' '; }
    else if(shown<rev){ hint+=n[i]; shown++; }
    else{ hint+='_'; }
  }
  setFeedback('💡 Hint: "'+hint+'"','hint');
}

function spawnParticles(color){
  const box=document.getElementById('map-svg').getBoundingClientRect();
  const cx=box.left+box.width/2, cy=box.top+box.height/3;
  const cols=[color,'#FFD700','#aaffaa','#ffffff','#ff88ff'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.left=(cx+(Math.random()-.5)*140)+'px';
    p.style.top=(cy+(Math.random()-.5)*100)+'px';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDelay=(Math.random()*0.3)+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(),1600);
  }
}

function endGame(){
  document.getElementById('xp-fill').style.width='100%';
  document.getElementById('end-screen').classList.add('show');
  document.getElementById('end-score').textContent=score+' / '+PROVINCES.length;
  const pct=score/PROVINCES.length;
  let msg;
  if(pct===1)      msg='🏆 Perfecte score! Jij kent alle namen!';
  else if(pct>=.83)msg='🥇 Bijna perfect! Nog even oefenen!';
  else if(pct>=.66)msg='🥈 Goed bezig! Je kent de meeste al!';
  else if(pct>=.5) msg='🥉 Aardig! Blijf oefenen!';
  else             msg='💡 Oefening baart kunst! Probeer opnieuw!';
  document.getElementById('end-msg').textContent=msg;
  for(let i=0;i<35;i++)setTimeout(()=>{
    const p=document.createElement('div'); p.className='particle';
    p.style.left=(Math.random()*window.innerWidth)+'px';
    p.style.top=(Math.random()*window.innerHeight*.6)+'px';
    const c=['#FFD700','#7CFC00','#FF6B6B','#3A86FF','#FFBE0B'];
    p.style.background=c[Math.floor(Math.random()*c.length)];
    p.style.width=p.style.height=(6+Math.random()*10)+'px';
    document.body.appendChild(p); setTimeout(()=>p.remove(),1500);
  },i*70);
}

function closeEnd(){document.getElementById('end-screen').classList.remove('show');startGame();}

startGame();
</script>
