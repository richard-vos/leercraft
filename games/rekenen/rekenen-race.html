<title>Reken Race 3D</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Press Start 2P',monospace;}
#c{display:block;width:100vw;height:100vh;}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}

/* Top bar */
#top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 20px 0;gap:12px;}
.hbox{background:rgba(0,0,0,0.78);border:3px solid #555;border-bottom-color:#222;border-right-color:#222;border-top-color:#888;border-left-color:#888;padding:8px 16px;}
.hlbl{font-size:8px;color:#666;letter-spacing:1px;margin-bottom:4px;}
.hval{font-size:18px;color:#FFD700;text-shadow:2px 2px #7A5A00;line-height:1;}
#hval-lap{font-size:14px;color:#fff;}
#hval-time{font-size:14px;color:#aaffaa;}

/* Standings */
#standings{position:absolute;left:14px;top:90px;display:flex;flex-direction:column;gap:5px;}
.srow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.78);border:2px solid #444;border-bottom-color:#222;border-right-color:#222;border-top-color:#666;border-left-color:#666;padding:6px 12px;font-size:10px;min-width:155px;}
.srow.me{border-color:#FFD700!important;}
.sdot{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;}

/* Positie groot */
#bigpos{position:absolute;bottom:90px;left:20px;line-height:1;}
#bignum{font-size:64px;color:#FFD700;text-shadow:4px 4px #7A5A00,5px 5px #000;}
#bigsuf{font-size:18px;color:#FFD700;vertical-align:super;}

/* Minimap */
#minimap{position:absolute;bottom:20px;left:20px;width:210px;height:210px;background:rgba(0,0,0,0.82);border:3px solid #555;border-bottom-color:#222;border-right-color:#222;border-top-color:#888;border-left-color:#888;overflow:hidden;}
#mm{width:210px;height:210px;}

/* Speedo */
#speedo{position:absolute;bottom:20px;right:20px;background:rgba(0,0,0,0.78);border:3px solid #444;border-bottom-color:#222;border-right-color:#222;border-top-color:#666;border-left-color:#666;padding:10px 18px;text-align:center;width:115px;}
#spnum{font-size:30px;color:#fff;line-height:1;}
#spunit{font-size:8px;color:#666;margin-top:3px;}
#spbar{background:#111;height:7px;border:1px solid #333;margin-top:8px;overflow:hidden;}
#spfill{height:100%;background:linear-gradient(90deg,#7CFC00,#FFD700);width:0%;transition:width 0.06s;}

/* Som banner */
#sombar{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);border:4px solid #FFD700;border-bottom-color:#7A5A00;border-right-color:#7A5A00;border-top-color:#FFE88A;border-left-color:#FFE88A;padding:12px 28px;font-size:20px;color:#FFD700;text-shadow:2px 2px #7A5A00;white-space:nowrap;opacity:0;transition:opacity 0.2s;pointer-events:none;}
#sombar.show{opacity:1;}

/* Feedback */
#fb{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:32px;opacity:0;transition:opacity 0.15s;pointer-events:none;text-align:center;}
#fb.show{opacity:1;}
#fb.ok{color:#7CFC00;text-shadow:0 0 24px #7CFC00;}
#fb.bad{color:#FF4444;text-shadow:0 0 24px #FF4444;}

/* Slow VFX */
#slowvfx{position:absolute;inset:0;background:rgba(255,0,0,0.13);pointer-events:none;opacity:0;transition:opacity 0.2s;}
#slowvfx.show{opacity:1;}

/* Countdown */
#cd{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);pointer-events:none;}
#cdnum{font-size:140px;color:#FFD700;text-shadow:6px 6px #7A5A00,8px 8px #000;}
.hidden{display:none!important;}

/* Schermen */
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:32px;background:rgba(0,0,0,0.9);}
.screen h1{font-size:clamp(18px,3vw,30px);color:#FFD700;text-shadow:3px 3px #7A5A00;line-height:1.7;}
.screen p{font-size:clamp(7px,1.2vw,10px);color:#aaa;line-height:2.2;max-width:500px;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0;}
.sbox{background:rgba(255,255,255,0.07);padding:14px 18px;border:1px solid #333;}
.sboxn{font-size:26px;color:#fff;}
.sboxl{font-size:7px;color:#555;margin-top:4px;letter-spacing:1px;}
.btn{font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.5vw,12px);padding:14px 30px;background:#5D9E3A;color:#fff;text-shadow:2px 2px #2A5A18;border:none;border-bottom:4px solid #2A5A18;border-right:4px solid #2A5A18;border-top:4px solid #8ADE5A;border-left:4px solid #8ADE5A;cursor:pointer;pointer-events:all;transition:filter 0.1s,transform 0.08s;}
.btn:hover{filter:brightness(1.2);}
.btn:active{transform:translateY(2px);border-bottom-width:2px;}
.btn.red{background:#C85A20;border-bottom-color:#7A2A08;border-right-color:#7A2A08;border-top-color:#F07A40;border-left-color:#F07A40;text-shadow:2px 2px #7A2A08;}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
#race-touch{position:fixed;inset:auto 12px max(14px,env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:space-between;pointer-events:none;}
#race-touch>div{display:flex;gap:10px;}
#race-touch button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:64px;height:64px;border:3px solid #b8db8d;border-radius:3px;background:#416e2e;color:white;font:bold 22px sans-serif;box-shadow:inset 3px 3px #6a9b4c,0 4px #223b18;}
#race-touch button.held{background:#82b955;transform:translateY(3px);}
#race-touch button:focus-visible{outline:3px solid white;outline-offset:3px;}
@media(hover:hover) and (pointer:fine){#race-touch{display:none;}}
@media(any-pointer:coarse){#race-touch{display:flex;}#minimap{bottom:94px;width:110px;height:110px;}#minimap canvas{width:100%;height:100%;}#speedo{bottom:100px;}#bigpos{bottom:100px;}}
@media(max-width:480px){#race-touch button{width:54px;height:60px;font-size:18px;}#race-touch>div{gap:6px;}}
</style>

<div class="screen" id="startscreen">
  <h1>🏁 Reken Race 3D</h1>

<script type="module">
import * as THREE from '../../assets/vendor/three-r128.module.js';

// ═══════════════════════════════════════════
// SCENE
// ═══════════════════════════════════════════
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 120, 500);

const camera = new THREE.PerspectiveCamera(58, W/H, 0.1, 600);
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// Verlichting
const sun = new THREE.DirectionalLight(0xfff4d0,1.3);
sun.position.set(80,120,60);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=500;
sun.shadow.camera.left=sun.shadow.camera.bottom=-200;
sun.shadow.camera.right=sun.shadow.camera.top=200;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xc8d8ff,0.75));
scene.add(new THREE.HemisphereLight(0x87CEEB,0x2d5a1b,0.5));

// ═══════════════════════════════════════════
// BAAN — cyclische Catmull-Rom
// ═══════════════════════════════════════════
const ROAD_W = 15;
const KERB_W = 2.2;

// Vloeiend circuit — brede bochten, geen hairpins, wel variatie
const RAW_CP = [
  [   0,    0],  // start/finish
  [  60,  -15],  // lichte bocht rechts
  [ 130,  -35],
  [ 200,  -25],  // ruime bocht
  [ 250,   20],
  [ 260,   80],  // grote bocht rechts
  [ 240,  140],
  [ 190,  175],
  [ 130,  190],  // lange rechte
  [  60,  185],
  [  10,  165],
  [ -40,  130],  // ruime bocht links
  [ -70,   85],
  [ -75,   40],  // zachte S links
  [ -55,    5],
  [ -20,  -10],  // terugkeer
];
const NCP = RAW_CP.length;

function cmGet(i){ return RAW_CP[((i%NCP)+NCP)%NCP]; }
function cmPoint(i0, f){
  const p0=cmGet(i0-1),p1=cmGet(i0),p2=cmGet(i0+1),p3=cmGet(i0+2);
  const f2=f*f,f3=f2*f;
  return [
    0.5*((2*p1[0])+(-p0[0]+p2[0])*f+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*f2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*f3),
    0.5*((2*p1[1])+(-p0[1]+p2[1])*f+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*f2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*f3)
  ];
}

const TRES = 1440; // hoge resolutie
const spline = [];
for(let i=0;i<TRES;i++){
  const g  = i/TRES*NCP;
  const i0 = Math.floor(g);
  const [x,z] = cmPoint(i0, g-i0);
  spline.push({x,z,tx:0,tz:0,nx:0,nz:0});
}
// Tangenten over 6 punten voor extra soepel
for(let i=0;i<TRES;i++){
  const a=spline[(i-6+TRES)%TRES], b=spline[(i+6)%TRES];
  const dx=b.x-a.x, dz=b.z-a.z, len=Math.sqrt(dx*dx+dz*dz)||1;
  spline[i].tx=dx/len; spline[i].tz=dz/len;
  spline[i].nx=-dz/len; spline[i].nz=dx/len;
}

// Springschansen: t-positie op de baan
const RAMPS = [0.30, 0.65]; // twee schansen op de baan

// Hoogte op de baan op positie t (voor schans-effect)
function rampHeight(t){
  let h=0;
  RAMPS.forEach(rt=>{
    const d=Math.abs(((t-rt+1.5)%1)-0.5);
    if(d<0.018) h=Math.max(h, Math.sin((1-d/0.018)*Math.PI)*3.5);
  });
  return h;
}

function tAt(t, off=0){
  const i=Math.floor(((t%1+1)%1)*TRES);
  const p=spline[i];
  return new THREE.Vector3(p.x+p.nx*off, 0, p.z+p.nz*off);
}
function tTan(t){
  const i=Math.floor(((t%1+1)%1)*TRES);
  return new THREE.Vector3(spline[i].tx,0,spline[i].tz);
}

// Bouw schans-meshes op de baan
function buildRamps(){
  RAMPS.forEach(rt=>{
    const pos=tAt(rt,0), tan=tTan(rt);
    const ang=Math.atan2(tan.x,tan.z);
    const g=new THREE.Group();

    // Aanloopvlak: plat stuk vóór de schans
    const run=new THREE.Mesh(
      new THREE.BoxGeometry(ROAD_W*2-1, 0.3, 4),
      new THREE.MeshLambertMaterial({color:0x885522})
    );
    run.position.set(0,0.15,-5); // vóór de schans (in rijrichting = positieve Z in groep)
    g.add(run);

    // Schans vlak: hellend omhoog in rijrichting
    // rotation.x negatief = voorkant omlaag, achterkant omhoog
    const rampMesh=new THREE.Mesh(
      new THREE.BoxGeometry(ROAD_W*2-1, 0.4, 7),
      new THREE.MeshLambertMaterial({color:0xAA6622})
    );
    rampMesh.rotation.x=-0.35; // helling omhoog richting rijrichting
    rampMesh.position.set(0,1.1,1.5);
    rampMesh.castShadow=true;
    g.add(rampMesh);

    // Lip bovenaan
    const lip=new THREE.Mesh(
      new THREE.BoxGeometry(ROAD_W*2-1, 0.5, 0.7),
      new THREE.MeshLambertMaterial({color:0xFFAA00})
    );
    lip.position.set(0,2.8,4.8);
    g.add(lip);

    // Geel-zwarte waarschuwingsstrepen
    for(let si=-3;si<=3;si++){
      const stripe=new THREE.Mesh(
        new THREE.BoxGeometry(1.8,0.42,7),
        new THREE.MeshLambertMaterial({color:si%2===0?0xFFDD00:0x111111})
      );
      stripe.rotation.x=-0.35;
      stripe.position.set(si*4,1.12,1.5);
      g.add(stripe);
    }

    g.position.set(pos.x,0,pos.z);
    g.rotation.y=ang;
    scene.add(g);
  });
}

// ═══════════════════════════════════════════
// BAAN MESH — alles in één buffer per materiaal
// ═══════════════════════════════════════════

// Verzamel alle vertices per materiaal, bouw daarna één mesh
function buildMergedMesh(triArrays, mat, yOff=0){
  const all=[];
  triArrays.forEach(pts=>{
    const [a,b,c,d]=pts;
    all.push(a[0],yOff,a[1], b[0],yOff,b[1], c[0],yOff,c[1]);
    all.push(a[0],yOff,a[1], c[0],yOff,c[1], d[0],yOff,d[1]);
  });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(all),3));
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,mat);
  mesh.receiveShadow=true;
  scene.add(mesh);
}

const M={
  road:  new THREE.MeshLambertMaterial({color:0x6a6a78}),
  k1:    new THREE.MeshLambertMaterial({color:0xDD2020}),
  k2:    new THREE.MeshLambertMaterial({color:0xFFFFFF}),
  line:  new THREE.MeshLambertMaterial({color:0xFFFFFF}),
  grass2:new THREE.MeshLambertMaterial({color:0x4a8a2e}),
  trunk: new THREE.MeshLambertMaterial({color:0x5a3a1a}),
  tree:  new THREE.MeshLambertMaterial({color:0x2d6a2d}),
  stone: new THREE.MeshLambertMaterial({color:0x888899}),
  gold:  new THREE.MeshLambertMaterial({color:0xDAA520}),
  wheel: new THREE.MeshLambertMaterial({color:0x111111}),
  rim:   new THREE.MeshLambertMaterial({color:0xaaaaaa}),
  glass: new THREE.MeshLambertMaterial({color:0x4488aa,transparent:true,opacity:0.65}),
};

// Grond
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshLambertMaterial({color:0x3a6e1c}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// Gras-blokje patroon — ook gemerged
{
  const grassVerts=[];
  const s=50;
  for(let xi=0;xi<28;xi++) for(let zi=0;zi<28;zi++){
    if((xi+zi)%2===0) continue;
    const gx=(xi-14)*s+25, gz=(zi-14)*s+25, h=s*0.5-0.2;
    grassVerts.push(
      gx-h,gz-h, gx+h,gz-h, gx+h,gz+h,
      gx-h,gz-h, gx+h,gz+h, gx-h,gz+h
    );
  }
  const gArr=new Float32Array(grassVerts.length/2*3);
  for(let i=0;i<grassVerts.length;i+=2){gArr[i/2*3]=grassVerts[i];gArr[i/2*3+1]=0.005;gArr[i/2*3+2]=grassVerts[i+1];}
  const gg=new THREE.BufferGeometry();
  gg.setAttribute('position',new THREE.BufferAttribute(gArr,3));
  gg.computeVertexNormals();
  scene.add(new THREE.Mesh(gg,M.grass2));
}

// Baan — verzamel per type, dan één mesh per type
{
  const roadQ=[], k1Q=[], k2Q=[], lineQ=[];
  for(let i=0;i<TRES;i++){
    const j=(i+1)%TRES;
    const a=spline[i],b=spline[j];
    const RW=ROAD_W, KW=KERB_W;

    roadQ.push([
      [a.x-a.nx*RW, a.z-a.nz*RW],[a.x+a.nx*RW, a.z+a.nz*RW],
      [b.x+b.nx*RW, b.z+b.nz*RW],[b.x-b.nx*RW, b.z-b.nz*RW]
    ]);

    const kA=(i%10<5)?k1Q:k2Q, kB=(i%10<5)?k2Q:k1Q;
    kA.push([[a.x-a.nx*RW,a.z-a.nz*RW],[a.x-a.nx*(RW+KW),a.z-a.nz*(RW+KW)],[b.x-b.nx*(RW+KW),b.z-b.nz*(RW+KW)],[b.x-b.nx*RW,b.z-b.nz*RW]]);
    kB.push([[a.x+a.nx*RW,a.z+a.nz*RW],[a.x+a.nx*(RW+KW),a.z+a.nz*(RW+KW)],[b.x+b.nx*(RW+KW),b.z+b.nz*(RW+KW)],[b.x+b.nx*RW,b.z+b.nz*RW]]);

    if(i%7===0) lineQ.push([
      [a.x-a.nx*0.35,a.z-a.nz*0.35],[a.x+a.nx*0.35,a.z+a.nz*0.35],
      [b.x+b.nx*0.35,b.z+b.nz*0.35],[b.x-b.nx*0.35,b.z-b.nz*0.35]
    ]);
  }
  buildMergedMesh(roadQ, M.road, 0.01);
  buildMergedMesh(k1Q,   M.k1,  0.02);
  buildMergedMesh(k2Q,   M.k2,  0.02);
  buildMergedMesh(lineQ, M.line,0.03);
}

// Finish lijn
const fp=tAt(0,0), ft=tTan(0);
const fperp=new THREE.Vector3(ft.z,0,-ft.x);
for(let fi=-5;fi<5;fi++) for(let fj=0;fj<2;fj++){
  const fc=((fi+fj)%2+2)%2===0?0x111111:0xffffff;
  const fm=new THREE.Mesh(new THREE.PlaneGeometry(2.9,2.9),new THREE.MeshLambertMaterial({color:fc}));
  fm.rotation.x=-Math.PI/2;
  fm.position.set(fp.x+fperp.x*(fi*3+1.5)+ft.x*fj*3,0.04,fp.z+fperp.z*(fi*3+1.5)+ft.z*fj*3);
  scene.add(fm);
}
// Finish palen
[-1,1].forEach(s=>{
  const pp=tAt(0,s*(ROAD_W+0.5));
  const pole=new THREE.Mesh(new THREE.BoxGeometry(0.4,9,0.4),M.stone);
  pole.position.set(pp.x,4.5,pp.z); scene.add(pole);
  const flag=new THREE.Mesh(new THREE.PlaneGeometry(3.5,2),new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide}));
  flag.position.set(pp.x+s*1.8,9,pp.z); scene.add(flag);
});

// Springschansen
buildRamps();

// Bomen — alleen ver buiten de baan
const treePosCache=[];
for(let i=0;i<TRES;i+=5){
  [-1,1].forEach(side=>{
    const minOff=ROAD_W+KERB_W+4, maxOff=minOff+20;
    const off=(minOff+Math.random()*(maxOff-minOff))*side;
    const tp=tAt(i/TRES,off);
    // Check afstand tot alle baanpunten
    let safe=true;
    for(let j=0;j<TRES;j+=3){
      const sp2=spline[j];
      const dx=tp.x-sp2.x, dz=tp.z-sp2.z;
      if(dx*dx+dz*dz<(ROAD_W+KERB_W+2)*(ROAD_W+KERB_W+2)){safe=false;break;}
    }
    if(!safe) return;
    const tooClose=treePosCache.some(p=>{const dx=p[0]-tp.x,dz=p[1]-tp.z;return dx*dx+dz*dz<64;});
    if(tooClose) return;
    treePosCache.push([tp.x,tp.z]);
    const sc=0.7+Math.random()*0.5;
    const trunk=new THREE.Mesh(new THREE.BoxGeometry(1.2*sc,4*sc,1.2*sc),M.trunk);
    trunk.position.set(tp.x,2*sc,tp.z); trunk.castShadow=true; scene.add(trunk);
    [[4,3,4],[3.5,3,3.5],[3,2,3]].forEach(([lw,lh,ld],li)=>{
      const leaf=new THREE.Mesh(new THREE.BoxGeometry(lw*sc,lh*sc,ld*sc),M.tree);
      leaf.position.set(tp.x,4*sc+(li+1)*lh*sc*0.7,tp.z); leaf.castShadow=true; scene.add(leaf);
    });
  });
}

}

function makeCar(col){
  const g=new THREE.Group();
  const bm=new THREE.MeshLambertMaterial({color:col});
  // Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.65,4),bm);
  body.position.y=0.55; body.castShadow=true; g.add(body);
  // Cabine
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.58,2.0),bm);
  cab.position.set(0,1.1,-0.1); cab.castShadow=true; g.add(cab);
  // Ruiten
  const wm=new THREE.MeshLambertMaterial({color:0x3377aa,transparent:true,opacity:0.65});
  [[[1.7,0.48,0.1],[0,1.1,0.96]],[[1.7,0.42,0.1],[0,1.1,-1.12]]].forEach(([s,p])=>{
    const w=new THREE.Mesh(new THREE.BoxGeometry(...s),wm);
    w.position.set(...p); g.add(w);
  });
  // Spoiler
  const sp=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.14,0.45),bm);
  sp.position.set(0,1.38,-2.1); g.add(sp);
  [-1,1].forEach(s=>{
    const sw=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.44,0.44),M.stone);
    sw.position.set(s*0.98,1.18,-2.1); g.add(sw);
  });
  // Wielen
  [[-1.15,0.38,1.35],[1.15,0.38,1.35],[-1.15,0.38,-1.35],[1.15,0.38,-1.35]].forEach(([wx,wy,wz])=>{
    const wg=new THREE.Group();
    const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.37,0.37,0.26,12),M.wheel);
    wh.rotation.z=Math.PI/2; wg.add(wh);
    const rm=new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,0.28,8),M.rim);
    rm.rotation.z=Math.PI/2; wg.add(rm);
    wg.position.set(wx,wy,wz);
    wg.userData.wheel=true;
    g.add(wg);
  });
  // Koplampen
  const hlm=new THREE.MeshLambertMaterial({color:0xffffcc,emissive:0xffffaa,emissiveIntensity:0.5});
  [-0.68,0.68].forEach(lx=>{
    const hl=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.18,0.07),hlm);
    hl.position.set(lx,0.62,2.03); g.add(hl);
  });
  scene.add(g);
  return g;
}

// Canvas texture helper
function makeTex(w,h,fn){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');fn(cx,w,h);
  const t=new THREE.CanvasTexture(cv);t.needsUpdate=true;return t;
}

// Billboard: boog over baan met grote som-tekst
function makeBillboard(t, tekst){
  const g=new THREE.Group();
  const pos=tAt(t,0), tan=tTan(t);
  const ang=Math.atan2(tan.x,tan.z);
  const poleX=ROAD_W+KERB_W+0.6;

  [-1,1].forEach(s=>{
    const pole=new THREE.Mesh(new THREE.BoxGeometry(0.7,11,0.7),M.stone);
    pole.position.set(s*poleX,5.5,0); g.add(pole);
  });
  const bar=new THREE.Mesh(new THREE.BoxGeometry(poleX*2+1.5,1.1,0.7),M.gold);
  bar.position.set(0,11.4,0); g.add(bar);

  // Groot bord
  const tex=makeTex(1024,256,(cx,w,h)=>{
    cx.fillStyle='#111';cx.fillRect(0,0,w,h);
    cx.strokeStyle='#FFD700';cx.lineWidth=16;cx.strokeRect(8,8,w-16,h-16);
    cx.strokeStyle='#fff';cx.lineWidth=4;cx.strokeRect(24,24,w-48,h-48);
    // Gespiegeld tekenen (Three.js spiegelt texture)
    cx.save();cx.translate(w,0);cx.scale(-1,1);
    cx.fillStyle='#FFD700';
    cx.font='bold 120px monospace';
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(tekst,w/2,h/2);
    cx.restore();
  });
  const board=new THREE.Mesh(new THREE.PlaneGeometry(poleX*2-0.5,4.5),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
  board.position.set(0,9.2,0); g.add(board);

  g.position.set(pos.x,0,pos.z);
  g.rotation.y=ang;
  scene.add(g);
  return g;
}

// Antwoord-poort — begint GRIJS, kleur pas bij aanraking
function makeGate(t, lane, val, correct){
  const g=new THREE.Group();
  const pos=tAt(t,lane*ROAD_W*0.6), tan=tTan(t);
  const ang=Math.atan2(tan.x,tan.z);

  // Grijze pylonen bij aanmaken
  const grayMat=new THREE.MeshLambertMaterial({color:0x777788});
  [-1,1].forEach(s=>{
    const pole=new THREE.Mesh(new THREE.BoxGeometry(0.55,7,0.55),grayMat);
    pole.position.set(s*3.1,3.5,0); pole.castShadow=true; g.add(pole);
  });
  const top=new THREE.Mesh(new THREE.BoxGeometry(6.8,0.75,0.55),grayMat);
  top.position.set(0,7.15,0); g.add(top);

  // Canvas bord — neutraal grijs
  const ns=String(val), fs=ns.length>2?160:220;
  const cv=document.createElement('canvas'); cv.width=512; cv.height=512;
  const cx=cv.getContext('2d');

  function drawNeutral(){
    cx.fillStyle='#222233'; cx.fillRect(0,0,512,512);
    cx.strokeStyle='#555566'; cx.lineWidth=22; cx.strokeRect(11,11,490,490);
    cx.strokeStyle='#888899'; cx.lineWidth=6;  cx.strokeRect(28,28,456,456);
    cx.save(); cx.translate(512,0); cx.scale(-1,1);
    cx.fillStyle='#aaaacc';
    cx.font=`bold ${fs}px monospace`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(ns,256,256); cx.restore();
  }

  function drawColored(){
    cx.fillStyle=correct?'#0a2e16':'#2e0a0a'; cx.fillRect(0,0,512,512);
    cx.strokeStyle=correct?'#7CFC00':'#FF4444'; cx.lineWidth=22; cx.strokeRect(11,11,490,490);
    cx.strokeStyle=correct?'#aaffaa':'#ffaaaa'; cx.lineWidth=6;  cx.strokeRect(28,28,456,456);
    cx.save(); cx.translate(512,0); cx.scale(-1,1);
    cx.fillStyle=correct?'#7CFC00':'#FF5555';
    cx.font=`bold ${fs}px monospace`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(ns,256,256); cx.restore();
  }

  drawNeutral();
  const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=true;
  const board=new THREE.Mesh(
    new THREE.PlaneGeometry(5.8,5.8),
    new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide})
  );
  board.position.set(0,3.4,0.32); g.add(board);

  g.position.set(pos.x,0,pos.z);
  g.rotation.y=ang;

  // Reveal-functie: aanroepen als speler er vlakbij komt
  g.userData.reveal=function(){
    if(g.userData.revealed) return;
    g.userData.revealed=true;
    drawColored();
    tex.needsUpdate=true;
    const colMat=new THREE.MeshLambertMaterial({color:correct?0x22AA44:0xAA2222});
    g.children.forEach(ch=>{ if(ch!==board) ch.material=colMat; });
  };
  g.userData.revealed=false;

  scene.add(g);
  return g;
}

const START_T=0;

const RACER_DEFS=[
  {col:0x229922,name:'Jij',   css:'#22AA44', maxSpd:0.00048, cpu:false},
  {col:0xCC2200,name:'Rood',  css:'#CC2200', maxSpd:0.00043, cpu:true},
  {col:0x2244CC,name:'Blauw', css:'#2244CC', maxSpd:0.00040, cpu:true},
  {col:0xDD6600,name:'Oranje',css:'#DD6600', maxSpd:0.00046, cpu:true},
  {col:0x882299,name:'Paars', css:'#882299', maxSpd:0.00038, cpu:true},
];

const racers=RACER_DEFS.map((d,i)=>({
  ...d,
  car:makeCar(d.col),
  t:START_T, off:OFFSETS[i], spd:0,
  lap:1, lastT:START_T, finished:false,
  spin:0, spinAng:0, slow:0,
  correct:0, wrong:0, somCount:0,

// ═══════════════════════════════════════════
// SPEL OBJECTEN
// ═══════════════════════════════════════════
let gameObjs=[];
let activeSomIdx=-1;

function spawnObjects(){
  gameObjs.forEach(o=>{
    if(o.group) scene.remove(o.group);
    if(o.mesh)  scene.remove(o.mesh);
  });
  gameObjs=[];
  activeSomIdx=-1;

  const pool=shuffle([...SOMMEN]).slice(0,10);
  const N=10;

  // Sommen verdeeld van t=0.08 tot t=0.92 met VEEL ruimte ertussen
  // Elke som = billboard op baseT, antwoorden op baseT+0.055
  // Blokgrootte = 0.084, dus bijna 1/12 van de baan per som
  pool.forEach((som,i)=>{
    const baseT = 0.06 + i*(0.88/N);
    const ansT  = baseT + 0.035; // antwoorden vlak na de vraag, ruim vóór de volgende som

    const bb=makeBillboard(baseT, som.q+' = ?');
    gameObjs.push({group:bb,type:'q',t:baseT,som,idx:i,triggered:false});

    const ans=shuffle([{v:som.a,ok:true},{v:som.w[0],ok:false},{v:som.w[1],ok:false}]);
    [-1,0,1].forEach((lane,ai)=>{
      const gate=makeGate(ansT,lane,ans[ai].v,ans[ai].ok);
      gameObjs.push({group:gate,type:'a',t:ansT,lane,val:ans[ai].v,ok:ans[ai].ok,somIdx:i,done:false});
    });
  });
}

// ═══════════════════════════════════════════
// COLLISION
// ═══════════════════════════════════════════
const T_TOL=0.018, OFF_TOL=ROAD_W*0.52;

function checkCol(){
  if(player.spin>0) return;
  const playerPos = tAt(player.t, player.off);

  gameObjs.forEach(obj=>{
    if(obj.done) return;
    const dt=Math.abs(((obj.t-player.t)+1.5)%1-0.5);

    if(obj.type==='q'){
      if(dt<T_TOL*1.5 && !obj.triggered){
        obj.triggered=true;
        activeSomIdx=obj.idx;
        showSom(obj.som.q+' = ?');
      }
    } else if(obj.type==='a'){
      // Reveal op basis van echte 3D-afstand, niet t-verschil
      if(!obj.done && obj.group.userData.reveal && !obj.group.userData.revealed){
        const gp = obj.group.position;
        const dx = gp.x - playerPos.x;
        const dz = gp.z - playerPos.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if(dist < 30) obj.group.userData.reveal();
      }

      // Collision
      if(dt > T_TOL) return;
      const doff = Math.abs(obj.lane*ROAD_W*0.6 - player.off);
      if(doff > OFF_TOL) return;
      obj.done=true;
      scene.remove(obj.group);

      if(obj.ok){
        player.spd=Math.min(player.maxSpd*1.3, player.spd+player.maxSpd*0.25);
        player.correct++;player.somCount++;
        showFb('✓ JUIST!','ok');
        showSom('');
        activeSomIdx=-1;
        gameObjs.forEach(o=>{
          if(o.type==='a'&&o.somIdx===obj.somIdx&&!o.done){
            o.done=true;scene.remove(o.group);
          }
        });
      } else {
        player.slow=90;player.spin=28;player.spd*=0.22;
        player.wrong++;player.somCount++;
        showFb('✗ FOUT! SPIN-OUT!','bad');
      }
    }
  });
}

// MINIMAP
// ═══════════════════════════════════════════
const mmCvs=document.getElementById('mm'), mmCtx=mmCvs.getContext('2d');
let mmMinX=Infinity,mmMaxX=-Infinity,mmMinZ=Infinity,mmMaxZ=-Infinity;
spline.forEach(p=>{
  if(p.x<mmMinX)mmMinX=p.x;if(p.x>mmMaxX)mmMaxX=p.x;
  if(p.z<mmMinZ)mmMinZ=p.z;if(p.z>mmMaxZ)mmMaxZ=p.z;
});
const mmRX=mmMaxX-mmMinX, mmRZ=mmMaxZ-mmMinZ;
function toMM(x,z){return{x:(x-mmMinX)/mmRX*196+7,y:(z-mmMinZ)/mmRZ*196+7};}

function drawMM(){
  mmCtx.clearRect(0,0,210,210);
  mmCtx.fillStyle='#111';mmCtx.fillRect(0,0,210,210);
  // Baan
  mmCtx.strokeStyle='#444';mmCtx.lineWidth=6;
  mmCtx.beginPath();spline.forEach((p,i)=>{const m=toMM(p.x,p.z);i===0?mmCtx.moveTo(m.x,m.y):mmCtx.lineTo(m.x,m.y);});mmCtx.closePath();mmCtx.stroke();
  mmCtx.strokeStyle='#888';mmCtx.lineWidth=2;
  mmCtx.beginPath();spline.forEach((p,i)=>{const m=toMM(p.x,p.z);i===0?mmCtx.moveTo(m.x,m.y):mmCtx.lineTo(m.x,m.y);});mmCtx.closePath();mmCtx.stroke();
  // Racers
  racers.forEach(r=>{
    const p=tAt(r.t,r.off), m=toMM(p.x,p.z);
    mmCtx.fillStyle=r.css;
    if(r===player){mmCtx.beginPath();mmCtx.arc(m.x,m.y,5,0,Math.PI*2);mmCtx.fill();}
    else{mmCtx.fillRect(m.x-3,m.y-3,7,7);}
  });
}

// ═══════════════════════════════════════════
function updateJump(r, dt){
  const rh = rampHeight(r.t);
  if(rh > 0.05 && !r.inAir){
    // Schans raken — geef opwaartse snelheid proportioneel aan rijsnelheid
    r.inAir  = true;
    r.jumpVY = 0.22 + r.spd * 80;
    r.jumpY  = rh;
  }
  if(r.inAir){
    r.jumpVY -= 0.018 * dt; // zwaartekracht
    r.jumpY  += r.jumpVY * dt;
    if(r.jumpY <= 0){
      r.jumpY=0; r.jumpVY=0; r.inAir=false;
    }
  } else {
    r.jumpY = rh; // op de schans zelf
  }
}

function placeRacer(r){
  const pos=tAt(r.t,r.off), tan=tTan(r.t);
  r.car.position.set(pos.x, r.jumpY, pos.z);
  // Lichte pitch omhoog als auto in de lucht is
  r.car.rotation.x = r.inAir ? Math.min(0.25, r.jumpVY*0.8) : 0;
  r.car.rotation.y = r.spin>0 ? r.spinAng : Math.atan2(tan.x,tan.z);
  r.car.children.forEach(c=>{
    if(c.userData.wheel) c.children.forEach(w=>{w.rotation.x+=r.spd*35;});
  });
}

const _cp=new THREE.Vector3(), _cl=new THREE.Vector3(), _camLook=new THREE.Vector3();
function updateCam(){
  const tan=tTan(player.t), pos=tAt(player.t,player.off);
  const jy=player.jumpY;
  _cp.set(pos.x-tan.x*9.5, 4.2+jy*0.6, pos.z-tan.z*9.5);
  _cl.set(pos.x+tan.x*7,   1.4+jy,     pos.z+tan.z*7);
  camera.position.lerp(_cp, 0.09);
  _camLook.lerp(_cl, 0.12);
  camera.lookAt(_camLook);
}

// ═══════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════
let lastTS=performance.now(), rafId;

function loop(ts){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTS)/16.667, 1.0); // max 1 frame, nooit meer
  lastTS=ts;

  if(!gameRunning){
    // Idle: toon startopstelling met camera erachter
    updateCam();
    renderer.render(scene,camera);
    return;
  }

  raceTime+=dt/60;

  // ── Speler ──
  if(player.spin>0){
    player.spin-=dt; player.spinAng+=0.18*dt; player.spd*=0.88;
  } else {
    const eff=player.slow>0 ? player.maxSpd*0.25 : player.maxSpd;
    if(K.gas||touchDrive.gas)   player.spd=Math.min(eff, player.spd+0.000055*dt);
    else        player.spd=Math.max(0,   player.spd-0.000030*dt);
    if(K.brake||touchDrive.brake) player.spd=Math.max(0,   player.spd-0.000080*dt);
    const steer=Math.min(1,player.spd/player.maxSpd)*0.26*dt;
    if(K.left||touchDrive.left)  player.off=Math.max(-ROAD_W*0.82, player.off-steer);
    if(K.right||touchDrive.right) player.off=Math.min( ROAD_W*0.82, player.off+steer);
  }
  if(player.slow>0) player.slow-=dt;
  player.t=(player.t+player.spd*dt+1)%1;
  if(player.t<0.02&&player.lastT>0.9){ player.lap++; if(player.lap>LAPS&&!player.finished){player.finished=true;endRace();} }
  player.lastT=player.t;

  // ── CPU's ──
  racers.slice(1).forEach(r=>{
    if(r.finished) return;
    const v=0.88+Math.sin(raceTime*0.9+r.maxSpd*5000)*0.12;
    r.spd=r.maxSpd*v;
    r.t=(r.t+r.spd*dt+1)%1;
    if(r.t<0.02&&r.lastT>0.9){r.lap++;if(r.lap>LAPS)r.finished=true;}
    r.lastT=r.t;
    r.off+=(Math.random()-0.5)*0.06*dt;
    r.off=Math.max(-ROAD_W*0.6,Math.min(ROAD_W*0.6,r.off));
  });

  checkCol();
  updateJump(player, dt);
  racers.slice(1).forEach(r=>updateJump(r,dt));
  racers.forEach(placeRacer);
  updateCam();
  updateHUD();
  drawMM();
  renderer.render(scene,camera);
}

// ═══════════════════════════════════════════
// START / EINDE
// ═══════════════════════════════════════════
let cdInt;
window.beginGame=function(){
  document.getElementById('startscreen').classList.add('hidden');
  document.getElementById('endscreen').classList.add('hidden');

  // Reset alle racers
  racers.forEach((r,i)=>{
    r.t=START_T; r.off=OFFSETS[i]; r.spd=0;
    r.lap=1; r.lastT=START_T; r.finished=false;
    r.spin=0; r.spinAng=0; r.slow=0;
    r.correct=0; r.wrong=0; r.somCount=0;
    r.jumpY=0; r.jumpVY=0; r.inAir=false;
  });
  raceTime=0; gameRunning=false;
  spawnObjects();

  // Zet auto's neer
  racers.forEach(placeRacer);

  // Countdown
  const cdEl=document.getElementById('cd'), cdN=document.getElementById('cdnum');
  cdEl.classList.remove('hidden');
  let n=3; cdN.textContent=n; cdN.style.color='#FFD700';
  clearInterval(cdInt);
  cdInt=setInterval(()=>{
    n--;
    if(n>0){
      cdN.textContent=n;
      cdN.style.animation='none';void cdN.offsetWidth;cdN.style.animation='';
    } else if(n===0){
      cdN.textContent='GO!';cdN.style.color='#7CFC00';
    } else {
      clearInterval(cdInt);
      cdEl.classList.add('hidden');
      cdN.style.color='#FFD700';
      gameRunning=true;
    }
  },900);
};

function endRace(){
  gameRunning=false;
  const sorted=[...racers].sort((a,b)=>prog(b)-prog(a));
  const pos=sorted.indexOf(player)+1;
  const titles=['🏆 GEWONNEN!','🥈 2e plek!','🥉 3e plek!','4e plek','5e plek'];
  document.getElementById('endtitle').textContent=titles[pos-1]||pos+'e plek';
  document.getElementById('epos').textContent=posSuf(pos);
  document.getElementById('ecor').textContent=player.correct+'/'+player.somCount;
  const m=Math.floor(raceTime/60),s=Math.floor(raceTime%60).toString().padStart(2,'0');
  document.getElementById('etim').textContent=m+"'"+s;
  document.getElementById('endscreen').classList.remove('hidden');
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
// Zet auto's alvast neer op startlijn
racers.forEach(placeRacer);
// Start idle render loop
lastTS=performance.now();
rafId=requestAnimationFrame(loop);
</script>
