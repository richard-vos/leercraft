<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RekenCraft</title>
<link href="../../assets/fonts/fonts.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:'Press Start 2P',monospace;touch-action:none;background:#000;}
#c{display:block;width:100vw;height:100vh;}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}

#topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;width:min(280px,70vw);}
.pcircle{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #29b6f6;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#0288d1;flex-shrink:0;}
#ptrack{flex:1;height:12px;border-radius:20px;background:rgba(0,0,0,.2);
  border:2px solid rgba(255,255,255,.5);overflow:hidden;}
#pfill{height:100%;border-radius:20px;background:linear-gradient(90deg,#29b6f6,#0288d1);width:0%;}
.pend{font-size:20px;}

#steve-badge{position:absolute;background:#1565c0;border-radius:20px;
  padding:4px 12px;font-size:clamp(12px,2.5vw,18px);color:#fff;
  transform:translate(-50%,-120%);pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;}

#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(16px,3vw,26px);color:#FFD700;text-align:center;
  text-shadow:3px 3px #000,0 0 20px rgba(255,215,0,.6);
  opacity:0;transition:opacity .3s;pointer-events:none;}
#msg.show{opacity:1;}
.score-burst{position:absolute;left:50%;top:43%;width:0;height:0;pointer-events:none;}
.score-burst strong{position:absolute;left:0;top:0;font-size:64px;line-height:1;
  color:var(--burst-color);text-shadow:3px 3px #17251b,-2px -2px #17251b;font-weight:900;}
.score-burst i{position:absolute;width:8px;height:8px;background:var(--burst-color);}
@media(max-width:480px){.score-burst strong{font-size:48px;}}

#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .08s;}
#flash.g{background:radial-gradient(ellipse at 50% 65%,rgba(0,220,80,.28),transparent 65%);}
#flash.r{background:radial-gradient(ellipse at 50% 65%,rgba(220,40,0,.24),transparent 65%);}
#flash.on{opacity:1;}

#hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  background:rgba(30,20,5,.8);border-radius:10px;padding:10px 20px;
  display:flex;gap:18px;align-items:center;}
.hb{display:flex;flex-direction:column;align-items:center;gap:5px;}
.hl{font-size:6px;color:#ccc;letter-spacing:1px;}
.hk{display:flex;gap:4px;}
.k{background:#555;border:2px solid #888;border-bottom-color:#222;
  padding:3px 8px;font-size:8px;color:#fff;border-radius:3px;}
.hd{width:1px;background:rgba(255,255,255,.2);height:38px;}
#hint.gone{opacity:0;transition:opacity 1s;}
#controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none;}
.ctrl-group{display:flex;gap:12px;pointer-events:auto;}
.ctrl{width:64px;height:64px;border-radius:18px;border:3px solid rgba(255,255,255,.75);
  background:rgba(20,35,20,.72);color:#fff;font:22px 'Press Start 2P',monospace;
  box-shadow:0 5px 0 rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;}
.ctrl:active,.ctrl.active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45);background:rgba(67,160,71,.9);}
#pause-btn{width:52px;height:52px;font-size:14px;pointer-events:auto;}
#sound-btn{position:absolute;right:18px;top:72px;width:48px;height:48px;border-radius:14px;
  border:3px solid rgba(255,255,255,.75);background:rgba(20,35,20,.78);color:#fff;
  font-size:21px;box-shadow:0 4px 0 rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;}
#sound-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45);}
#pause-label{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:#fff;font-size:clamp(18px,5vw,34px);text-shadow:3px 3px #000;background:rgba(0,0,0,.28);}
#pause-label.show{display:flex;}
#battle-toast{position:absolute;top:19%;left:50%;transform:translate(-50%,-10px) scale(.8);
  opacity:0;color:#ffe66d;font-size:clamp(12px,3vw,22px);white-space:nowrap;
  text-shadow:3px 3px #4e2600,0 0 18px #ffb300;transition:none;}
#battle-toast.show{animation:battleWin .9s ease-out both;}
@keyframes battleWin{
  0%{opacity:0;transform:translate(-50%,8px) scale(.65)}
  20%,70%{opacity:1;transform:translate(-50%,0) scale(1.08)}
  100%{opacity:0;transform:translate(-50%,-18px) scale(1)}
}

.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;}
#ss{overflow-y:auto;justify-content:safe center;background:linear-gradient(rgba(8,25,5,.56),rgba(3,12,2,.88)),url('../../assets/images/rekenen-run-start.webp') center/cover no-repeat;}
#ws{background:linear-gradient(160deg,#0a2040,#051020);}
#ls{box-sizing:border-box;overflow-y:auto;justify-content:safe center;gap:24px;
  background:rgba(24,18,14,.87);}
.banner{width:calc(100%+56px);margin-left:-28px;padding:14px;letter-spacing:2px;
  font-size:clamp(13px,3vw,22px);color:#fff;}
#ss .banner{background:linear-gradient(90deg,#1b5e20,#66bb6a,#1b5e20);}
#ws .banner{background:linear-gradient(90deg,#0d47a1,#42a5f5,#0d47a1);}
#ls .banner{box-sizing:border-box;width:min(540px,100%);margin:0;padding:26px 16px;
  border:4px solid #301f19;border-radius:2px;background:#a34c38;
  box-shadow:inset 5px 5px #d77a52,inset -5px -5px #683829,0 8px #211b16;
  color:#fff1d5;text-shadow:3px 4px #472319;letter-spacing:0;line-height:1.7;}
#ls .defeat-copy{margin:4px 0 0;max-width:440px;font:18px/1.6 sans-serif;color:#eee1c5;}
#ls .defeat-level{color:#b9d79b;font:14px/1.6 'Press Start 2P',monospace;}
#ls .gbtn{box-sizing:border-box;width:min(360px,100%);min-height:60px;padding:18px 16px;
  border:3px solid #c0dc8f;border-radius:2px;background:#4d893d;
  box-shadow:inset 4px 4px #86b960,inset -4px -4px #2e562b,0 6px #182c17;
  text-shadow:2px 2px #233b1c;line-height:1.7;touch-action:manipulation;}
#ls .gbtn:active{transform:translateY(4px);box-shadow:inset 3px 3px #2e562b,0 2px #182c17;}
#ls .gbtn:focus-visible{outline:3px solid white;outline-offset:5px;}
.screen p{font-size:clamp(6px,1.2vw,9px);color:#aaa;line-height:2.4;max-width:400px;}
.gbtn{font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.6vw,13px);
  padding:14px 32px;border:none;border-radius:28px;cursor:pointer;pointer-events:all;
  background:linear-gradient(180deg,#66bb6a,#388e3c);color:#fff;
  text-shadow:0 2px rgba(0,0,0,.3);
  box-shadow:0 5px 0 #1b5e20,0 7px 14px rgba(0,0,0,.4);transition:transform .07s;}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #1b5e20;}
#math-settings{min-width:0;flex-shrink:0;}
.operator-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-bottom:6px;}
.operator-choice{position:relative;cursor:pointer;touch-action:manipulation;}
.operator-choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
.operator-choice span{display:flex;align-items:center;justify-content:center;min-height:68px;
  font-family:'Press Start 2P',monospace;font-size:28px;color:#e5e5e5;
  border:3px solid #202820;background:#626b60;border-radius:2px;
  box-shadow:inset 3px 3px #929d8d,inset -3px -3px #3c453a,0 5px #172516;
  text-shadow:2px 3px #263025;transition:transform .08s,background .08s;}
.operator-choice input:checked+span{background:#438f39;color:#fff;
  border-color:#b5e775;box-shadow:inset 3px 3px #79c65b,inset -3px -3px #265c25,0 5px #193d19;}
.operator-choice input:checked+span::after{content:'';position:absolute;right:9px;top:9px;width:7px;height:7px;background:#e2ff9d;}
.operator-choice input:focus-visible+span{outline:3px solid #fff;outline-offset:4px;}
.operator-choice:active span{transform:translateY(3px);}
#math-max{appearance:none;-webkit-appearance:none;height:48px;background:transparent;cursor:pointer;touch-action:pan-y;}
#math-max::-webkit-slider-runnable-track{height:14px;background:#273f24;border:3px solid #142311;box-shadow:inset 0 3px #43623b;}
#math-max::-moz-range-track{height:8px;background:#273f24;border:3px solid #142311;}
#math-max::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:36px;height:36px;margin-top:-14px;border:3px solid #d0ef9c;border-radius:2px;background:#65ac43;box-shadow:inset 3px 3px #9cdb67,inset -3px -3px #32682a,0 3px #142311;}
#math-max::-moz-range-thumb{width:30px;height:30px;border:3px solid #d0ef9c;border-radius:2px;background:#65ac43;box-shadow:inset 3px 3px #9cdb67,inset -3px -3px #32682a,0 3px #142311;}
#math-max:focus-visible{outline:3px solid #fff;outline-offset:2px;}
.level-code{width:min(360px,100%);font:16px/1.5 sans-serif;color:white;flex-shrink:0;}
.level-code input{box-sizing:border-box;width:100%;min-height:48px;margin:8px 0;padding:10px;border:3px solid #79ad58;border-radius:2px;background:#20311c;color:#fff;font:18px monospace;text-align:center;}
.level-code button{min-height:48px;}
#code-error{color:#ffb8a8;min-height:24px;font:14px/1.5 sans-serif;}
.gbtn.red{background:linear-gradient(180deg,#ef5350,#c62828);box-shadow:0 5px 0 #7f0000,0 7px 14px rgba(0,0,0,.4);}
.srow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.sbox{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:12px 20px;}
.sn{font-size:22px;color:#fff;}.sl{font-size:6px;color:#546e7a;margin-top:4px;letter-spacing:1px;}
.earn{font-size:clamp(16px,3vw,24px);color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.5);}
.hidden{display:none!important;}
@media (pointer:fine){#controls{display:none;}}
@media (max-width:700px){#hint{display:none}.screen{padding:20px}.ctrl{width:58px;height:58px}}
#ss{display:block;padding:0 0 32px;text-align:left;}
#ss .banner{box-sizing:border-box;width:100%;margin:0;padding:24px 16px;text-align:center;letter-spacing:0;}
#ss .start-intro{box-sizing:border-box;max-width:760px;margin:24px auto 32px;padding:0 24px;
  font:16px/1.6 sans-serif;color:#e2efdc;text-align:center;}
.start-layout{box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
  gap:40px;width:min(850px,100%);margin:auto;padding:0 28px;}
.start-new{min-width:0;}
#ss h2{margin:0 0 24px;font:16px/1.6 'Press Start 2P',monospace;color:#d7f4ac;}
#ss #math-settings{box-sizing:border-box;width:100%;margin:0 0 20px;padding:0;border:0;color:white;font:16px/1.5 sans-serif;}
#math-settings legend{padding:0;margin-bottom:12px;}
.max-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;}
#math-max-value{min-width:36px;padding:4px 8px;background:#294522;border:2px solid #79ad58;text-align:center;font-weight:bold;}
#ss #math-max{width:100%;margin:8px 0 0;}
#ss .gbtn{box-sizing:border-box;width:100%;min-height:52px;border-radius:3px;}
#ss #resume-form{box-sizing:border-box;width:100%;min-width:0;border-left:2px solid #59774a;padding-left:32px;}
#ss #resume-code{margin:12px 0 20px;}
#ss #code-error{margin-top:12px;}
@media(max-width:620px){
  #ss .banner{padding:20px 12px;}
  #ss .start-intro{margin:18px auto 24px;font-size:15px;}
  .start-layout{grid-template-columns:minmax(0,1fr);gap:32px;padding:0 20px;max-width:430px;}
  #ss #resume-form{border-left:0;border-top:2px solid #59774a;padding:24px 0 0;}
  #ss h2{font-size:14px;margin-bottom:18px;}
}
</style>

</head>

<script type="module">
import * as THREE from '../../assets/vendor/three-0.160.0.module.min.js';

// SETUP

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,200);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,300);
const audioListener=new THREE.AudioListener();
camera.add(audioListener);

// ═══════════════════════════════════════════════════
// AUDIO — procedureel, dus geen losse geluidsbestanden nodig
// ═══════════════════════════════════════════════════
const audioCtx=audioListener.context;
const audioMaster=audioCtx.createGain();
audioMaster.gain.value=.58;
audioMaster.connect(audioListener.getInput());

const sampleCache={};
function playSample(name,volume=.75){
  if(!soundOn)return;
  const uri=sampleUris[name];
  if(!uri)return;
  const audio=sampleCache[name]?.cloneNode()||new Audio(uri);
  if(!sampleCache[name]){sampleCache[name]=audio;audio.preload='auto';}
  audio.volume=volume;
  audio.currentTime=0;
  audio.play().catch(()=>{});
}
function soundHurt(){playSample('hurt',.72);}

function unlockAudio(){
  if(soundOn&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
}
function tone(freq,duration=.1,type='square',volume=.08,slide=1,delay=0){
  if(!soundOn||audioCtx.state!=='running')return;
  const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(Math.max(25,freq),now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(25,freq*slide),now+duration);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(gain);gain.connect(audioMaster);osc.start(now);osc.stop(now+duration+.02);
}
function noise(duration=.12,volume=.07,lowpass=900,delay=0){
  if(!soundOn||audioCtx.state!=='running')return;
  const count=Math.ceil(audioCtx.sampleRate*duration),buffer=audioCtx.createBuffer(1,count,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);for(let i=0;i<count;i++)data[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  const now=audioCtx.currentTime+delay;src.buffer=buffer;filter.type='lowpass';filter.frequency.value=lowpass;
  gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  src.connect(filter);filter.connect(gain);gain.connect(audioMaster);src.start(now);
}
function soundStep(){noise(.055,.025,420);tone(82,.05,'square',.018,.72);}
function soundGate(good){
  if(good){tone(440,.10,'square',.07,1.35);tone(660,.13,'square',.06,1.25,.09);}
  else{tone(190,.16,'sawtooth',.07,.62);tone(120,.18,'square',.05,.7,.08);}
}
function soundSwordHit(){playSample('sword',.62);tone(760,.07,'sawtooth',.055,.35);noise(.11,.075,1800,.025);tone(115,.12,'square',.045,.7,.035);}
function soundCreeperRam(){tone(95,.13,'sawtooth',.045,.62);noise(.09,.04,500);}
function soundExplosion(){noise(.65,.16,650);tone(72,.55,'sawtooth',.11,.28);tone(48,.4,'square',.07,.45,.04);}
function soundVictory(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.06,1.04,i*.08));}

// Original eight-bar chiptune, scheduled on the audio clock for a steady beat.
const musicBus=audioCtx.createGain();
musicBus.gain.value=0;musicBus.connect(audioMaster);
const musicMelody=[
  [76,79,81,79,76,74,72,74],[76,79,84,81,79,76,74,0],
  [77,81,84,81,77,76,74,76],[74,79,83,81,79,74,71,0],
  [76,79,81,84,83,79,76,74],[76,79,84,86,84,81,79,0],
  [77,81,84,81,79,77,76,74],[79,83,86,83,79,74,72,0]
];
const musicRoots=[48,45,41,43,48,45,41,43];
let musicStep=0,musicNext=0,musicPlaying=false;
function musicNote(midi,at,length,volume,type='triangle',slide=1){
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  const frequency=440*2**((midi-69)/12);
  osc.type=type;osc.frequency.setValueAtTime(frequency,at);
  osc.frequency.exponentialRampToValueAtTime(frequency*slide,at+length);
  gain.gain.setValueAtTime(.0001,at);
  gain.gain.exponentialRampToValueAtTime(volume,at+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,at+length);
  osc.connect(gain);gain.connect(musicBus);
  osc.onended=()=>{osc.disconnect();gain.disconnect();};
  osc.start(at);osc.stop(at+length+.02);
}
function tickMusic(){
  const active=gameOn&&!paused&&soundOn&&!document.hidden&&audioCtx.state==='running';
  const now=audioCtx.currentTime;
  if(active!==musicPlaying){
    musicPlaying=active;
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setTargetAtTime(active?.65:0,now,.035);
    musicNext=now+.04;
  }
  if(!active)return;
  if(musicNext<now-.1)musicNext=now+.02;
  const stepDuration=60/132/2;
  while(musicNext<now+.09){
    const bar=Math.floor(musicStep/8)%8,beat=musicStep%8;
    const melody=musicMelody[bar][beat],root=musicRoots[bar];
    if(melody)musicNote(melody,musicNext,stepDuration*.8,.045,'square');
    if(beat%2===0)musicNote(root+(beat===4?7:0),musicNext,.25,.10);
    if(beat===0||beat===4)musicNote(43,musicNext,.13,.13,'sine',.35);
    if(beat===2||beat===6){
      musicNote(74,musicNext,.045,.025,'triangle',.3);
      musicNote(91,musicNext,.035,.012,'square',.5);
    }
    if(beat%2)musicNote(root+24+[0,7,12,7][Math.floor(beat/2)],musicNext,.1,.025);
    musicStep=(musicStep+1)%64;musicNext+=stepDuration;
  }
}
document.addEventListener('visibilitychange',()=>tickMusic());

const fc=c=>new THREE.MeshLambertMaterial({color:c});
function pixelBlockMaterial(palette,seed=1,brick=true,emissive=0){
  const cv=document.createElement('canvas');cv.width=cv.height=32;
  const cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
  let s=seed>>>0;
  const rnd=()=>((s=Math.imul(1664525,s)+1013904223>>>0)/4294967296);
  cx.fillStyle=palette[0];cx.fillRect(0,0,32,32);
  // Grove 4×4-pixels geven ieder blok een duidelijke Minecraft-structuur.
  for(let y=0;y<32;y+=4)for(let x=0;x<32;x+=4){
    cx.fillStyle=palette[Math.floor(rnd()*palette.length)];cx.fillRect(x,y,4,4);
  }
  if(brick){
    cx.fillStyle='rgba(18,14,18,.48)';
    for(let y=0;y<32;y+=8){
      cx.fillRect(0,y,32,1);
      const off=(y/8)%2?8:0;
      for(let x=off;x<32;x+=16)cx.fillRect(x,y,1,8);
    }
    cx.fillStyle='rgba(255,255,255,.12)';
    for(let y=1;y<32;y+=8)cx.fillRect(0,y,32,1);
  }
  // Enkele scherpe highlights/scheurtjes voorkomen een vlak tegelpatroon.
  for(let i=0;i<13;i++){
    cx.fillStyle=rnd()>.5?'rgba(255,255,255,.16)':'rgba(0,0,0,.22)';
    cx.fillRect(Math.floor(rnd()*16)*2,Math.floor(rnd()*16)*2,2,2);
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestMipmapNearestFilter;
  const mat=new THREE.MeshLambertMaterial({map:tex,color:0xffffff});
  if(emissive){mat.emissive=new THREE.Color(emissive);mat.emissiveIntensity=.55;}
  return mat;
}

function makeMesh(geo,mat,x,y,z,cast=false,recv=true){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  if(cast)m.castShadow=true;
  if(recv)m.receiveShadow=true;
  return m;
}

function buildWorld(){
  const tileGeo=new THREE.BoxGeometry(TILE,TILE,TILE);
  const tileCount=PAD_TILES_Z*(PAD_HW*2+1);
  const evenTiles=new THREE.InstancedMesh(tileGeo,M.dirtA,tileCount);
  const oddTiles=new THREE.InstancedMesh(tileGeo,M.dirtB,tileCount);
  const wallMeshes=WALL_MATS.map(mat=>new THREE.InstancedMesh(tileGeo,mat,PAD_TILES_Z*2));
  const capMeshes=WALL_CAP_MATS.map(mat=>new THREE.InstancedMesh(tileGeo,mat,Math.ceil(PAD_TILES_Z/3)*2));
  const lanterns=new THREE.InstancedMesh(tileGeo,wallLanternMat,Math.ceil(PAD_TILES_Z/12)*2);
  const foundations=new THREE.InstancedMesh(tileGeo,M.edgeDark,PAD_TILES_Z*2);
  const dummy=new THREE.Object3D();
  let evenI=0,oddI=0,foundationI=0,lanternI=0;
  const wallI=WALL_MATS.map(()=>0),capI=WALL_CAP_MATS.map(()=>0);

  // Pad: drie draw calls in plaats van duizenden losse meshes.
  for(let zi=0;zi<PAD_TILES_Z;zi++){
    for(let xi=-PAD_HW;xi<=PAD_HW;xi++){
      dummy.position.set(xi*TILE,0,-zi*TILE);dummy.updateMatrix();
      const patch=Math.sin(xi*.8+Math.sin(zi*.19)*2)+Math.cos(zi*.35+xi*.3);
      if(patch>.1) evenTiles.setMatrixAt(evenI++,dummy.matrix);
      else oddTiles.setMatrixAt(oddI++,dummy.matrix);
    }
    for(const [side,rx] of [[0,-(PAD_HW+1)],[1,(PAD_HW+1)]]){
      // Gekleurde muursecties van 3-5 blokken, geïnspireerd op Minecraft-biomes.
      dummy.position.set(rx*TILE,.75,-zi*TILE);
      dummy.scale.set(1,.75,1);dummy.updateMatrix();
      const style=(Math.floor(zi/4)+side*2)%wallMeshes.length;
      wallMeshes[style].setMatrixAt(wallI[style]++,dummy.matrix);
      // Om de drie blokken een gekleurd, getextureerd kantelblok.
      if(zi%3===0){
        dummy.position.set(rx*TILE,2.05,-zi*TILE);
        dummy.scale.set(.68,.62,.68);dummy.updateMatrix();
        const capStyle=(Math.floor(zi/3)+side)%capMeshes.length;
        capMeshes[capStyle].setMatrixAt(capI[capStyle]++,dummy.matrix);
      }
      // Cyaan sea-lanternaccenten zorgen voor kleur en diepte tussen de kantelen.
      if(zi%12===6){
        dummy.position.set(rx*TILE,1.78,-zi*TILE);
        dummy.scale.set(.28,.28,.28);dummy.updateMatrix();
        lanterns.setMatrixAt(lanternI++,dummy.matrix);
      }
      dummy.scale.set(1,1,1);
      dummy.position.set(rx*TILE,-1.65,-zi*TILE);dummy.updateMatrix();
      foundations.setMatrixAt(foundationI++,dummy.matrix);
    }
  }
  evenTiles.count=evenI;oddTiles.count=oddI;
  wallMeshes.forEach((mesh,i)=>mesh.count=wallI[i]);
  capMeshes.forEach((mesh,i)=>mesh.count=capI[i]);lanterns.count=lanternI;
  [evenTiles,oddTiles,...wallMeshes,...capMeshes,lanterns,foundations].forEach(mesh=>{
    mesh.castShadow=capMeshes.includes(mesh);mesh.receiveShadow=true;
    mesh.instanceMatrix.needsUpdate=true;worldGroup.add(mesh);
  });

  // Mos- en keisteenaccenten doorbreken het egale schaakbordpatroon.
  for(let zi=7;zi<PAD_TILES_Z;zi+=9){
    const x=((zi%5)-2)*TILE;
    const accent=makeMesh(new THREE.BoxGeometry(.35+(zi%4)*.13,.025,.28+(zi%3)*.17),zi%18?M.dirtB:M.moss,x,1.015,-zi*TILE,false,true);
    worldGroup.add(accent);
  }

  // Omgeving (gras, bomen, rotsen)
  buildEnv();
}

function buildEnv(){
  const tg=new THREE.BoxGeometry(TILE,TILE,TILE);
  const grassCount=Math.ceil(PAD_TILES_Z/2)*2*9;
  const grass=new THREE.InstancedMesh(tg,M.grass,grassCount);
  const dummy=new THREE.Object3D();let grassI=0;
  for(let zi=0;zi<PAD_TILES_Z;zi+=2){
    for(const side of [-1,1]){
      for(let gi=2;gi<=10;gi++){
        const x=(PAD_HW+gi)*TILE*side;
        const z=-zi*TILE+(Math.random()-.5)*2;
        dummy.position.set(x,0,z);dummy.updateMatrix();grass.setMatrixAt(grassI++,dummy.matrix);
      }
    }
  }
  grass.receiveShadow=true;grass.instanceMatrix.needsUpdate=true;worldGroup.add(grass);

  // Bomen
  for(let zi=3;zi<PAD_TILES_Z;zi+=6){
    for(const side of [-1,1]){
      if(Math.random()<.3) continue;
      const tx=(PAD_HW+3+Math.random()*5)*TILE*side;
      const tz=-zi*TILE+(Math.random()-.5)*8;
      buildTree(tx,tz);
    }
  }

  // Lage voxelheuvels, altijd minimaal 18 units buiten de rijbaan.
  for(let i=0;i<24;i++){
    const side=Math.random()<.5?-1:1;
    const bx=side*(PAD_W+18+Math.random()*55);
    const bz=-(12+Math.random()*276);
    const layers=2+Math.floor(Math.random()*3);
    for(let layer=0;layer<layers;layer++){
      const size=7+(layers-layer)*3;
      const block=new THREE.Mesh(new THREE.BoxGeometry(size,2,size),layer===layers-1?M.grass:(layer%2?M.rock2:M.rock));
      block.position.set(bx,1+layer*2,bz);block.castShadow=layer===layers-1;block.receiveShadow=true;
      worldGroup.add(block);
    }
  }
}

function buildTree(x,z){
  const sh=3+Math.floor(Math.random()*3);
  const tg=new THREE.BoxGeometry(1,1,1);
  for(let i=0;i<sh;i++){
    const m=makeMesh(tg,M.wood,x,.5+i,z,true,false);
    worldGroup.add(m);
  }
  // Bladeren (blokken)
  const offsets=[
    [0,sh+.5,0],[1,sh+.5,0],[-1,sh+.5,0],[0,sh+.5,1],[0,sh+.5,-1],
    [0,sh+1.5,0],[1,sh+1.5,0],[-1,sh+1.5,0],[0,sh+1.5,1],[0,sh+1.5,-1],
    [0,sh+2.5,0]
  ];
  offsets.forEach(([ox,oy,oz])=>{
    worldGroup.add(makeMesh(tg,Math.random()>.4?M.leaf:M.leaf2,x+ox,oy,z+oz,true,false));
  });
}

  const part=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  part.position.set(x,y,z);part.castShadow=w*h*d>.005;return part;
}

  g.add(boxPart(.10*s,.16*s,.025*s,M.cLight,-.11*s,1.05*s,.163*s));
  g.add(boxPart(.12*s,.13*s,.025*s,M.cDark,.10*s,.80*s,.163*s));

  [-.12,.12].forEach(px=>{

    this.group=new THREE.Group();
    scene.add(this.group);
    this.meshes=[];
    this.x=0; this.z=0;
    this.displayCount=0;
    this.countPulse=0;
  }
  setPos(x,z){
    this.x=x; this.z=z;
    this.group.position.set(x,0,z);
  }
  rebuild(n){
    this.count=Math.max(0,n);
    // Steve is één speelpersonage. Zijn kracht staat in het blauwe getal en
    // wordt niet meer als een groep identieke Steves op de baan getekend.
    if(this.isSteve&&this.meshes.length===1){
      this.meshes[0].visible=this.count>0;
      return;
    }
    this.meshes.forEach(m=>{
      this.group.remove(m);
      m.traverse(part=>part.geometry?.dispose());
    });
    this.meshes=[];
    const vis=this.isSteve?(this.count>0?1:0):Math.min(this.count,80);
    if(!vis) return;
    const cols=Math.max(1,Math.ceil(Math.sqrt(vis*1.5)));
    const sc=vis>50?.4:vis>25?.52:vis>10?.66:.82;
    const sp=1.3*sc;
    for(let i=0;i<vis;i++){
      const col=i%cols-cols/2+.5;
      const row=Math.floor(i/cols);
      const charScale=sc*2;
      const m=this.isSteve?makeSteve(charScale):makeCreeper(charScale);
      m.position.set(
        col*sp+(Math.random()-.5)*.12,
        1, // Y=1 zodat ze OP de blokken staan
        row*sp+(Math.random()-.5)*.12
      );
      m.userData.ph=Math.random()*Math.PI*2;
      m.userData.sc=charScale;
      m.userData.home=m.position.clone();
      this.group.add(m);
      this.meshes.push(m);
    }
  }
  setAnimatedCount(n,from=this.displayCount){
    this.displayCount=Number.isFinite(from)?from:this.count;
    this.count=Math.max(0,n);
    this.countPulse=1;
  }
  tickCounter(dt){
    const ease=1-Math.exp(-8*dt);
    this.displayCount=THREE.MathUtils.lerp(this.displayCount,this.count,ease);
    if(Math.abs(this.displayCount-this.count)<.02)this.displayCount=this.count;
    this.countPulse=Math.max(0,this.countPulse-dt*3.2);
    const pulse=1+Math.sin(this.countPulse*Math.PI)*this.countPulse*.09;
    this.group.scale.setScalar(pulse);
  }
  animate(t,dt,mode){
    this.meshes.forEach(m=>{
      if(!m.visible) return;
      if(m.userData.dying)return;
      const ph=m.userData.ph||0,sc=m.userData.sc||1;
      const moving=mode==='run'||mode==='approach'||mode==='obstacle'||mode==='finish';
      const fighting=mode==='battle';
      const stride=Math.sin(t*8+ph);
      const cycle=mode==='battle'?battleCycle:0;
      const steveSwing=this.isSteve&&mode==='battle'&&cycle<.25?Math.sin(cycle/.25*Math.PI):0;
      const creeperRush=!this.isSteve&&mode==='battle'&&cycle>.22&&cycle<.43?Math.sin((cycle-.22)/.21*Math.PI):0;
      const attack=mode==='battle'?(this.isSteve?steveSwing:creeperRush):0;
      const motion=moving ? 1 : (fighting ? 0.55 : 0);
      const home=m.userData.home;
      m.position.x=(home?.x??m.position.x)+(this.isSteve?Math.sin(bTimer*22)*steveSwing*.72:0);
      m.position.z=(home?.z??m.position.z)+(this.isSteve?-steveSwing*2.2:creeperRush*.58);
      m.position.y=1+(moving?Math.abs(stride)*.075*sc:fighting?Math.sin(attack*Math.PI)*.10*sc:0);
      m.rotation.z=this.isSteve?-steveSwing*.12:(creeperRush*.08*Math.sin(ph));
      m.children.forEach(c=>{
        if(c.userData.li===0) c.rotation.x= stride*.45*motion+attack*.25*(fighting?1:0);
        if(c.userData.li===1) c.rotation.x=-stride*.45*motion-attack*.25*(fighting?1:0);
        if(c.userData.ai===0) c.rotation.x=-stride*.4*motion-attack*.9*(fighting?1:0);
        if(c.userData.ai===1) c.rotation.x= stride*.4*motion-attack*(this.isSteve?2.2:.65)*(fighting?1:0);
      });
    });
  }
  killOne(){
    const alive=this.meshes.filter(m=>m.visible);
    if(!alive.length) return;
    const v=alive[Math.floor(Math.random()*alive.length)];
    spawnSplat(this.x+v.position.x,this.z+v.position.z,
      this.isSteve?0x4fc3f7:0x66cc44);
    const next=Math.max(0,this.count-1);
    // De ene zichtbare Steve blijft vechten zolang zijn rekenwaarde > 0 is.
    if(!this.isSteve||next===0)v.visible=false;
    this.count=next;
  }
}

const splats=[];
const explosions=[];
const battleVictims=[];
const swordArcs=[];
let cameraShake=0;
function spawnSplat(wx,wz,color){
  const mat=new THREE.MeshLambertMaterial({color,transparent:true,opacity:.8});
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(.12+Math.random()*.08,5,4),mat.clone());
    const a=Math.random()*Math.PI*2,r=.1+Math.random()*.6;
    m.position.set(wx+Math.cos(a)*r,1.1,wz+Math.sin(a)*r);
    m.userData.life=1; scene.add(m); splats.push(m);
  }
}

function spawnTntExplosion(x,z){
  soundExplosion();
  const group=new THREE.Group();
  group.position.set(x,2.2,z);
  const geo=new THREE.BoxGeometry(.38,.38,.38);
  const mats=[0xfff176,0xff8f00,0xf44336,0x4a3b36].map(color=>
    new THREE.MeshLambertMaterial({color,emissive:color,emissiveIntensity:.55,transparent:true})
  );
  const particles=[];
  for(let i=0;i<34;i++){
    const m=new THREE.Mesh(geo,mats[i%mats.length]);
    const a=Math.random()*Math.PI*2;
    const speed=2.8+Math.random()*6.2;
    m.position.set((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5);
    m.userData.vel=new THREE.Vector3(Math.cos(a)*speed,3+Math.random()*6,Math.sin(a)*speed);
    m.userData.spin=new THREE.Vector3(Math.random()*8,Math.random()*8,Math.random()*8);
    group.add(m);particles.push(m);
  }
  const ringMat=new THREE.MeshBasicMaterial({color:0xffd54f,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.82,24),ringMat);
  ring.rotation.x=-Math.PI/2;ring.position.y=-1.12;group.add(ring);
  const light=new THREE.PointLight(0xff6d00,7,18);group.add(light);
  group.userData={life:0,duration:1.05,particles,geo,mats,ring,ringMat,light};
  scene.add(group);explosions.push(group);
  cameraShake=.45;
}

function tickExplosions(dt){
  cameraShake=Math.max(0,cameraShake-dt*1.7);
  for(let i=explosions.length-1;i>=0;i--){
    const g=explosions[i],d=g.userData;
    d.life+=dt;
    const p=Math.min(1,d.life/d.duration);
    d.particles.forEach(m=>{
      m.userData.vel.y-=12*dt;
      m.position.addScaledVector(m.userData.vel,dt);
      m.rotation.x+=m.userData.spin.x*dt;
      m.rotation.y+=m.userData.spin.y*dt;
      m.rotation.z+=m.userData.spin.z*dt;
      m.scale.setScalar(Math.max(.05,1-p*.82));
    });
    d.mats.forEach(mat=>mat.opacity=1-p);
    d.ring.scale.setScalar(1+p*8);
    d.ringMat.opacity=(1-p)*.9;
    d.light.intensity=7*(1-p);
    if(p>=1){
      scene.remove(g);d.geo.dispose();d.mats.forEach(m=>m.dispose());
      d.ring.geometry.dispose();d.ringMat.dispose();explosions.splice(i,1);
    }
  }
}
function tickSplats(dt){
  for(let i=splats.length-1;i>=0;i--){
    splats[i].userData.life-=dt*2.5;
    splats[i].material.opacity=Math.max(0,splats[i].userData.life*.8);
    if(splats[i].userData.life<=0){
      scene.remove(splats[i]);splats[i].geometry.dispose();splats[i].material.dispose();splats.splice(i,1);
    }
  }
}

function spawnSwordArc(x,z){
  const mat=new THREE.MeshBasicMaterial({color:0x8ff7ff,transparent:true,opacity:.95,depthWrite:false,side:THREE.DoubleSide});
  const arc=new THREE.Mesh(new THREE.TorusGeometry(1.25,.10,4,18,Math.PI*.92),mat);
  arc.position.set(x,3.0,z);arc.rotation.z=-.45;arc.userData.life=0;scene.add(arc);swordArcs.push(arc);
}

function markBattleVictims(crowd,n,awayZ){
  const available=crowd.meshes.filter(m=>m.visible&&!m.userData.dying);
  for(let i=0;i<Math.min(n,available.length);i++){
    const m=available[i];m.userData.dying=true;
    battleVictims.push({m,crowd,t:0,start:m.position.clone(),awayZ,side:(i%2?1:-1)*(.7+Math.random())});
    spawnSplat(crowd.x+m.position.x,crowd.z+m.position.z,crowd.isSteve?0x4fc3f7:0x66cc44);
  }
}

function tickBattleEffects(dt){
  for(let i=battleVictims.length-1;i>=0;i--){
    const v=battleVictims[i];v.t+=dt;const p=Math.min(1,v.t/.35),e=1-Math.pow(1-p,2);
    v.m.position.x=v.start.x+v.side*e;
    v.m.position.z=v.start.z+v.awayZ*e*2.4;
    v.m.position.y=v.start.y+Math.sin(p*Math.PI)*1.5;
    v.m.rotation.z=v.side*p*1.8;v.m.scale.setScalar(Math.max(.04,1-p));
    if(p>=1){v.m.visible=false;v.m.userData.dying=false;v.m.scale.setScalar(1);battleVictims.splice(i,1);}
  }
  for(let i=swordArcs.length-1;i>=0;i--){
    const a=swordArcs[i];a.userData.life+=dt;const p=Math.min(1,a.userData.life/.18);
    a.scale.setScalar(.6+p*1.3);a.material.opacity=1-p;
    if(p>=1){scene.remove(a);a.geometry.dispose();a.material.dispose();swordArcs.splice(i,1);}
  }
}

function makeTex(txt,bgColor){
  const cv=document.createElement('canvas');
  cv.width=512;cv.height=192;
  const cx=cv.getContext('2d');
  cx.fillStyle=bgColor;cx.fillRect(0,0,512,192);
  cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=10;cx.strokeRect(5,5,502,182);
  cx.fillStyle='#fff';
  cx.font='bold 92px Arial,sans-serif';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.shadowColor='rgba(0,0,0,.45)';cx.shadowBlur=6;
  cx.fillText(txt,256,96);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;return t;
}

function parseOp(s){return{sym:s[0],val:parseInt(s.slice(1)),str:s};}

function buildGate(z,lop,rop){
  const g=new THREE.Group();

  // Elk bord is smal: ~35% van de baanbreedte
  // Totale baanbreedte = PAD_W*2 = 20 units
  // Elk bord = 6 units breed, tussenruimte 1 unit aan elke kant = genoeg om langs te lopen
  const BW = 6.0;   // breedte één bord
  const BH = 3.0;   // hoogte bord
  const BY = 4.2;   // extra hoge doorgang voor de 2× grotere karakters
  const PH = BY+BH+0.6; // paal hoogte

  // Centra van de twee borden
  const lCX = -(BW/2 + 1.0); // links bord centrum
  const rCX =  (BW/2 + 1.0); // rechts bord centrum

  // Palen: links buiten, midden, rechts buiten
  [lCX-BW/2-0.3, 0, rCX+BW/2+0.3].forEach(px=>{
    const pm=new THREE.Mesh(new THREE.BoxGeometry(0.45,PH,0.45),M.wood);
    pm.position.set(px,PH/2,0);pm.castShadow=true;g.add(pm);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),M.wood);
    cap.position.set(px,PH+0.25,0);g.add(cap);
  });
  // Balk boven alleen over de breedte van de borden
  const balkW=(rCX+BW/2+0.55)*2;
  const balk=new THREE.Mesh(new THREE.BoxGeometry(balkW,0.5,0.45),M.wood);
  balk.position.set(0,PH+0.45,0);g.add(balk);

  // Bord helper
  function addBoard(cx2,op){
    // Beide poorten zijn bewust neutraal: kleur mag het juiste antwoord niet verklappen.
    const bg='#5d4037';
    const col=0x795548;
    const ecol=0xd7ccc8;

    const bm=new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:0.92});
    const brd=new THREE.Mesh(new THREE.BoxGeometry(BW,BH,0.15),bm);
    brd.userData.disposeOwn=true;
    brd.position.set(cx2,BY+BH/2,0);g.add(brd);

    const em=new THREE.MeshLambertMaterial({color:ecol});
    const edg=new THREE.Mesh(new THREE.BoxGeometry(BW+0.2,BH+0.2,0.09),em);
    edg.userData.disposeOwn=true;
    edg.position.set(cx2,BY+BH/2,-0.1);g.add(edg);

    const sp=new THREE.Sprite(new THREE.SpriteMaterial({
      map:makeTex(op.str,bg),transparent:true,depthTest:false
    }));
    sp.userData.disposeOwn=true;
    sp.scale.set(BW*0.88,BH*0.75,1);
    sp.position.set(cx2,BY+BH/2,0.2);g.add(sp);

    addTorch(g,cx2-BW/2-0.7,-0.6);
    addTorch(g,cx2+BW/2+0.7,-0.6);
  }

  addBoard(lCX,lop);
  addBoard(rCX,rop);

  g.position.set(0,0,z);
  scene.add(g);

  // Collision zones: elk bord heeft een hitbox
  // Links bord: X van lCX-BW/2 tot lCX+BW/2
  // Rechts bord: X van rCX-BW/2 tot rCX+BW/2
  g.userData.lx1=lCX-BW/2; g.userData.lx2=lCX+BW/2;
  g.userData.rx1=rCX-BW/2; g.userData.rx2=rCX+BW/2;
  g.userData.lop=lop; g.userData.rop=rop;

  return g;
}

function buildObstacle(seg){
  const g=new THREE.Group();
  const x=seg.x;
  if(seg.kind==='water'){
    g.add(boxPart(4.3,.08,3.8,waterMat,0,1.06,0));
    for(const side of [-1,1]){
      g.add(boxPart(.35,.45,4.2,M.dirtB,side*2.32,1.15,0));
      g.add(boxPart(4.3,.25,.25,M.dirtA,0,1.1,side*2));
      g.add(boxPart(.7,.025,.12,foamMat,side*1.2,1.115,side*.65));
    }
  }else if(seg.kind==='tower'){
    g.add(boxPart(3.6,3.6,3.2,M.cobble,0,2.8,0));
    g.add(boxPart(1.0,1.35,.12,M.black,0,2.7,1.66));
    [-1.35,-.45,.45,1.35].forEach(px=>g.add(boxPart(.55,.7,3.5,M.stone,px,4.85,0)));
  }else if(seg.kind==='hut'){
    g.add(boxPart(4.0,2.6,3.0,M.wood,0,2.3,0));
    g.add(boxPart(4.5,.65,3.5,M.roof,0,3.9,0));
    g.add(boxPart(1.0,1.7,.12,M.black,0,2.05,1.56));
    [-1.18,1.18].forEach(px=>g.add(boxPart(.65,.65,.13,M.glass,px,2.65,1.57)));
  }else{
    [[-1,0],[1,0],[0,1.45]].forEach(([bx,by])=>{
      g.add(boxPart(1.65,1.65,1.65,M.tnt,bx,1.82+by,0));
      g.add(boxPart(1.72,.40,1.72,M.tntBand,bx,1.82+by,0));
    });
  }
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:makeTex(`-${seg.penalty}`,'#8b1a1a'),transparent:true,depthTest:false}));
  label.scale.set(2.2,1.1,1);label.position.set(0,seg.kind==='water'?2.8:5.7,0);label.userData.disposeOwn=true;g.add(label);
  g.position.set(x,0,seg.z);
  g.userData.x1=x-2.15;g.userData.x2=x+2.15;
  scene.add(g);return g;
}

function buildFinish(z){
  const g=new THREE.Group();
  const H=9,W=15;
  // Stevige Minecraft-finishboog.
  [-W/2,W/2].forEach(x=>{
    for(let y=1;y<=H;y+=1.5)g.add(boxPart(1.45,1.45,1.45,y%3?M.obsidian:M.diamond,x,y,0));
  });
  for(let x=-W/2;x<=W/2;x+=1.5)g.add(boxPart(1.45,1.45,1.45,Math.round(x*2)%2?M.gold:M.obsidian,x,H,0));
  // Geblokte finishlijn over de hele weg.
  for(let x=-9;x<=9;x+=2){
    g.add(boxPart(2,.10,2,((x+10)/2)%2?M.black:M.tntBand,x,1.03,0));
  }
  const sign=new THREE.Sprite(new THREE.SpriteMaterial({map:makeTex('FINISH','#3b1f52'),transparent:true,depthTest:false}));
  sign.scale.set(8,3,1);sign.position.set(0,7.2,.35);sign.userData.disposeOwn=true;g.add(sign);
  // Twee cyan beaconstralen maken de finish al op grote afstand herkenbaar.
  const beamMat=new THREE.MeshBasicMaterial({color:0x66f7ff,transparent:true,opacity:.24,depthWrite:false});
  [-W/2,W/2].forEach(x=>{
    const beam=new THREE.Mesh(new THREE.BoxGeometry(.55,22,.55),beamMat.clone());
    beam.position.set(x,12,0);beam.userData.disposeOwn=true;g.add(beam);
    g.add(boxPart(1.8,.65,1.8,M.diamond,x,1.35,0));
  });
  g.position.set(0,0,z);scene.add(g);return g;
}

// OPERATORS
// ═══════════════════════════════════════════════════
function applyOp(op,n){
  if(op.sym==='+') return Math.min(999,n+op.val);
  if(op.sym==='-') return Math.max(1,n-op.val);
  if(op.sym==='×') return Math.min(999,n*op.val);
  if(op.sym==='÷') return Math.max(1,Math.ceil(n/op.val));
  return n;
}
const mathSettings={operators:['+','-','×','÷'],max:10};
function codeChecksum(text){
  let hash=17;
  for(const ch of text)hash=(hash*31+ch.charCodeAt(0))%46656;
  return hash.toString(36).toUpperCase().padStart(3,'0');
}
function makeLevelCode(nextLevel,count,settings){
  const mask=['+','-','×','÷'].reduce((n,op,i)=>n|(settings.operators.includes(op)?1<<i:0),0);
  const body=[1,nextLevel,count,mask,settings.max].map(n=>n.toString(36).toUpperCase()).join('-');
  return 'RUN-'+body+'-'+codeChecksum(body);
}
function readLevelCode(value){
  const parts=value.toUpperCase().replace(/\s/g,'').split('-');
  if(parts.length!==7||parts[0]!=='RUN'||parts.slice(1).some(p=>!/^[0-9A-Z]+$/.test(p)))throw Error('Controleer je wachtwoord en probeer opnieuw.');
  const body=parts.slice(1,6).join('-');
  const [version,nextLevel,count,mask,max]=parts.slice(1,6).map(p=>parseInt(p,36));
  if(parts[6]!==codeChecksum(body)||version!==1||!Number.isSafeInteger(nextLevel)||nextLevel<2||count<1||count>999||mask<1||mask>15||max<3||max>20)throw Error('Dit levelwachtwoord is niet geldig.');
  return {nextLevel,count,max,operators:['+','-','×','÷'].filter((_,i)=>mask&(1<<i))};
}
document.getElementById('resume-form').addEventListener('submit',e=>{
  e.preventDefault();
  try{
    const saved=readLevelCode(document.getElementById('resume-code').value);
    level=saved.nextLevel;prevSteveCount=saved.count;
    mathSettings.max=saved.max;mathSettings.operators=saved.operators;
    mathInputs.forEach(input=>input.checked=saved.operators.includes(input.value));
    document.getElementById('math-max').value=saved.max;
    document.getElementById('math-max-value').textContent=saved.max;
    document.getElementById('code-error').textContent='';
    window.startGame();
  }catch(error){document.getElementById('code-error').textContent=error.message;}
});
const mathInputs=[...document.querySelectorAll('#math-settings input[type="checkbox"]')];
mathInputs.forEach(input=>input.addEventListener('change',()=>{
  if(!mathInputs.some(el=>el.checked))input.checked=true;
  mathSettings.operators=mathInputs.filter(el=>el.checked).map(el=>el.value);
}));
document.getElementById('math-max').addEventListener('input',e=>{
  mathSettings.max=Number(e.target.value);
  document.getElementById('math-max-value').textContent=mathSettings.max;
});
const reductionPractice=()=>!mathSettings.operators.some(op=>op==='+'||op==='×');
const practiceStart=()=>Math.min(999,6*mathSettings.max);
function genOpPair(lvl,n){
  const candidates=[];
  for(const sym of mathSettings.operators)for(let val=1;val<=mathSettings.max;val++){
    if(sym==='÷'&&(val<2||n%val!==0))continue;
    const op={sym,val,str:(sym==='÷'?':':sym)+val};
    if(applyOp(op,n)>0)candidates.push(op);
  }
  const viable=candidates.filter(op=>applyOp(op,n)>1);
  const good=viable[Math.floor(Math.random()*viable.length)]||candidates[0];
  const alternatives=candidates.filter(op=>applyOp(op,n)<applyOp(good,n));
  const bad=alternatives[Math.floor(Math.random()*alternatives.length)]||good;
  return [good,bad];
}

// ═══════════════════════════════════════════════════
// LEVEL GENERATIE — gegarandeerd winbaar via goed poortje
// ═══════════════════════════════════════════════════
function genLevel(lvl){
  segs=[];
  const rounds=3+Math.min(lvl,4);
  let z=-30;
  let simCount=steveC.count;

  for(let r=0;r<rounds;r++){
    // Bepaal eerst een goed operator (die genoeg Steve's geeft)
    const [chosenGood,chosenBad]=genOpPair(lvl,simCount);

    // Kies een GOED poortje en bereken resultaat
    const goodOp=chosenGood;
    const scoreAfterGood=applyOp(goodOp,simCount);

    // crN moet KLEINER zijn dan scoreAfterGood (winbaar via goed poortje)
    // maar niet te makkelijk: 60-90% van scoreAfterGood
    const crMax=Math.max(2,Math.floor(scoreAfterGood*0.88));
    const crMin=Math.max(2,Math.floor(scoreAfterGood*0.55));
    let crN=crMin+Math.floor(Math.random()*(crMax-crMin+1));

    // Zorg dat crN niet gelijk is aan scoreAfterGood
    if(crN===scoreAfterGood) crN=Math.max(2,crN-1);

    // Kies slecht poortje (resultaat kleiner dan crN zodat speler verliest bij fout keuze)
    const badOp=chosenBad;
    const scoreAfterBad=applyOp(badOp,simCount);
    // Zorg dat bad ook niet gelijk is aan crN
    const finalCrN=Math.max(1,Math.min(scoreAfterGood-1,crN));

    // Willekeurig links of rechts goed/fout
    const leftGood=Math.random()>.5;
    const lop=leftGood?goodOp:badOp;
    const rop=leftGood?badOp:goodOp;

    const gateZ_val=z;
    // Op hogere levels staan de Creepers en volgende poort steeds iets dichterbij.
    const battleDistance=Math.max(17,22-(lvl-1));
    const battleZ_val=z-battleDistance;

    segs.push({type:'gate',z:gateZ_val,lop,rop,crN:finalCrN,battleZ:battleZ_val,done:false,obj:null});
    segs.push({type:'battle',z:battleZ_val,crCount:finalCrN,done:false,obj:null});
    const obstacleKinds=['water','hut','tower','tnt'];
    const obstacleKind=r===1?'water':obstacleKinds[Math.floor(Math.random()*obstacleKinds.length)];
    const obstacleX=[-5,0,5][Math.floor(Math.random()*3)];
    const penalty=Math.random()<.55?1:3;
    segs.push({type:'obstacle',z:battleZ_val-18,x:obstacleX,kind:obstacleKind,penalty,done:false,obj:null});

    // Simuleer dat speler slim speelt (goed poortje)
    simCount=reductionPractice()?practiceStart():Math.max(1,scoreAfterGood-finalCrN);
    const roundSpacing=Math.max(54,60-(lvl-1)*1.5);
    z-=roundSpacing;
  }
  const lastObstacle=[...segs].reverse().find(seg=>seg.type==='obstacle');
  if(lastObstacle){
    const z=lastObstacle.z-27;
    segs.push({type:'finish',z,done:false,obj:buildFinish(z)});
  }
  // Plaats alle groepen bij de levelstart, ook de groepen voorbij de mist.
  for(const seg of segs){
    if(seg.type!=='gate')continue;
    const crowd=new Crowd(false);
    crowd.rebuild(seg.crN);
    crowd.setAnimatedCount(seg.crN,seg.crN);
    crowd.setPos(0,seg.battleZ);
    seg.previewCrowd=crowd;
    seg.previewCrN=seg.crN;
    seg.previewSteveCount=null;
  }
}

// Bepaal de tegenstand pas op het moment dat de poort verschijnt.
// Daardoor blijft iedere ronde haalbaar met het actuele aantal Steve's,
// ook wanneer in een eerdere ronde niet de optimale poort is gekozen.
function fairCreeperCount(lop,rop,currentCount){
  const leftResult=applyOp(lop,currentCount);
  const rightResult=applyOp(rop,currentCount);
  const losingResult=Math.min(leftResult,rightResult);
  const winningResult=Math.max(leftResult,rightResult);
  const minCreepers=Math.max(1,losingResult);
  const maxCreepers=Math.max(minCreepers,winningResult-1);
  return minCreepers+Math.floor(Math.random()*(maxCreepers-minCreepers+1));
}

function showScoreBurst(diff){
  const root=document.createElement('div');
  root.className='score-burst';
  root.style.setProperty('--burst-color',diff>0?'#7dff79':diff<0?'#ff715b':'#e1f5fe');
  const number=document.createElement('strong');
  number.textContent=(diff>0?'+':'')+diff;
  root.append(number);
  document.getElementById('msg').parentElement.append(root);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  number.animate(reduced?[
    {transform:'translate(-50%,-50%)',opacity:1},
    {transform:'translate(-50%,-50%)',opacity:0}
  ]:[
    {transform:'translate(-50%,-50%) scale(.35)',opacity:0,offset:0},
    {transform:'translate(-50%,-50%) scale(1.25)',opacity:1,offset:.18},
    {transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.35},
    {transform:'translate(-50%,-50%) scale(1.12)',opacity:1,offset:.65},
    {transform:'translate(-50%,-50%) scale(1.8)',opacity:0,offset:1}
  ],{duration:950,easing:'ease-out',fill:'forwards'});
  if(!reduced)for(let i=0;i<24;i++){
    const pixel=document.createElement('i');
    const angle=i/24*Math.PI*2;
    const radius=65+Math.random()*65;
    pixel.style.background=i%3===0?'#fff':i%3===1&&diff>0?'#ffe66d':'var(--burst-color)';
    root.append(pixel);
    pixel.animate([
      {transform:'translate(-4px,-4px) scale(.3)',opacity:0},
      {opacity:1,offset:.12},
      {transform:`translate(${Math.cos(angle)*radius}px,${Math.sin(angle)*radius+24}px) rotate(180deg) scale(.2)`,opacity:0}
    ],{duration:650,delay:550,easing:'ease-out',fill:'both'});
  }
  setTimeout(()=>root.remove(),1250);
}

const _v3=new THREE.Vector3();
function updateBadgePos(){
  // Steve badge
  _v3.set(steveC.x, 5.5, steveC.z);
  _v3.project(camera);
  const sx=(_v3.x*.5+.5)*innerWidth;
  const sy=(-.5*_v3.y+.5)*innerHeight;
  const sel=document.getElementById('steve-badge');
  sel.style.left=sx+'px';
  sel.style.top=sy+'px';
  sel.textContent=Math.round(steveC.displayCount);

  // Creeper badge — toon altijd als er creepers zijn
  const cel=document.getElementById('creeper-badge');
  if(creeperC.count>0){
    _v3.set(creeperC.x, 5.5, creeperC.z);
    _v3.project(camera);
    const cx2=(_v3.x*.5+.5)*innerWidth;
    const cy2=(-.5*_v3.y+.5)*innerHeight;
    cel.style.left=cx2+'px';
    cel.style.top=cy2+'px';
    cel.textContent=Math.round(creeperC.displayCount);
    cel.style.display='block';
  } else {
    cel.style.display='none';
  }
  for(const seg of segs){
    if(!seg.previewCrowd){seg.previewBadge?.remove();seg.previewBadge=null;continue;}
    if(!seg.previewBadge){
      seg.previewBadge=cel.cloneNode(false);
      seg.previewBadge.removeAttribute('id');
      seg.previewBadge.style.cssText='position:absolute;background:#bf360c;border-radius:20px;padding:4px 12px;color:white;pointer-events:none;transform:translate(-50%,-120%);';
      cel.parentElement.append(seg.previewBadge);
    }
    _v3.set(0,5.5,seg.battleZ).project(camera);
    const distance=camera.position.distanceTo(seg.previewCrowd.group.position);
    const opacity=1-THREE.MathUtils.smoothstep(distance,80,200);
    const badge=seg.previewBadge;
    badge.textContent=seg.previewCrowd.count;
    badge.style.display=_v3.z>-1&&_v3.z<1&&opacity>0?'block':'none';
    badge.style.left=(_v3.x*.5+.5)*innerWidth+'px';
    badge.style.top=(-_v3.y*.5+.5)*innerHeight+'px';
    badge.style.opacity=opacity;
  }
}

const _cp=new THREE.Vector3();
const _cl=new THREE.Vector3();
function updateCamera(dt){
  // Camera staat hoog (Y=22) en 20 units ACHTER Steve (+ z richting)
  _cp.set(steveC.x*.18, 22, steveC.z+20);
  if(cameraShake>0){
    _cp.x+=(Math.random()-.5)*cameraShake;
    _cp.y+=(Math.random()-.5)*cameraShake*.55;
  }
  _cl.set(steveC.x*.08, 1, steveC.z-8);
  camera.position.lerp(_cp,1-Math.exp(-6*dt));
  camera.lookAt(_cl);
}

// ═══════════════════════════════════════════════════
// GATE COLLISION CHECK
// ═══════════════════════════════════════════════════
function checkGate(){
  if(!gateObj||gateLop===null) return;
  const distToGate=gateZ-steveZ; // positief = gate nog vóór Steve
  if(distToGate>1.5||distToGate<-2.5) return; // buiten bereik

  const ud=gateObj.userData;
  const sx=steveX; // Steve's X positie

  // Controleer of Steve door links bord loopt
  if(sx>=ud.lx1-0.3 && sx<=ud.lx2+0.3){
    hitGate(gateLop, 'left');
  }
  // Controleer of Steve door rechts bord loopt
  else if(sx>=ud.rx1-0.3 && sx<=ud.rx2+0.3){
    hitGate(gateRop, 'right');
  }
  // Steve loopt erLANGS (buiten beide borden) → straf
  else if(sx<ud.lx1-0.3 || sx>ud.rx2+0.3){
    hitGateMiss();
  }
}

function checkObstacle(){
  if(!obstacleObj)return;
  if(obstacleAnim>=.75 && Math.abs(steveZ-obstacleZ)<1.9 && steveX>=obstacleObj.userData.x1 && steveX<=obstacleObj.userData.x2){
    const seg=segs[segIdx];
    if(seg.kind==='tnt')spawnTntExplosion(seg.x,seg.z);
    if(seg.kind==='water'){
      waterFall=.75;
      for(let i=0;i<7;i++)spawnSplat(steveX+(Math.random()-.5)*2,seg.z+(Math.random()-.5)*2,0x75d7ff);
      noise(.4,.13,700);tone(260,.28,'sine',.1,.3);
    }
    const prev=steveC.count;
    const lost=Math.min(seg.penalty,Math.max(0,prev-1));
    const next=prev-lost;
    if(lost>0)soundHurt();
    if(seg.kind!=='tnt'&&seg.kind!=='water'){noise(.16,.08,360);tone(105,.16,'square',.06,.55);}
    steveC.rebuild(next);steveC.setAnimatedCount(next,prev);
    doFlash(false);
    showScoreBurst(-lost);
    finishObstacle(seg.kind==='tnt');
  }else if(steveZ<obstacleZ-2.2){
    showMsg('Netjes ontweken!',700);
    finishObstacle();
  }
}

function checkFinish(){
  if(!finishObj||steveZ>finishZ+.8)return;
  phase='finishCelebrate';
  soundVictory();
  showMsg(`LEVEL ${level} VOLTOOID!`,1800);
  doFlash(true);
  spawnTntExplosion(-5,finishZ-2);
  spawnTntExplosion(5,finishZ-2);
  setTimeout(()=>spawnTntExplosion(0,finishZ-5),260);
  finishTimer=setTimeout(()=>endLevel(true),1450);
}

function animateObstacleSpawn(dt){
  // Obstakels staan vast in de wereld. Alleen Steve beweegt ernaartoe.
  obstacleAnim=1;
}

function finishObstacle(destroyed=false){
  if(!obstacleObj)return;
  segs[segIdx].done=true;
  if(destroyed)removeSceneObject(obstacleObj);
  else retireSceneObject(obstacleObj,obstacleZ);
  obstacleObj=null;
  advanceSeg();
}

function hitGate(op, side){
  const good=applyOp(op,steveC.count)>creeperC.count;
  const prev=steveC.count;
  const next=applyOp(op,steveC.count);
  soundGate(good);
  if(next<prev)soundHurt();
  steveC.rebuild(next);
  steveC.setAnimatedCount(next,prev);
  doFlash(good);
  const diff=steveC.count-prev;
  showScoreBurst(diff);
  finishGate();
}

function hitGateMiss(){
  // Langs gereden zonder door een poort: -4 Steve's
  const penalty=4;
  const prev=steveC.count;
  const next=Math.max(1,prev-penalty);
  soundGate(false);
  if(next<prev)soundHurt();
  steveC.rebuild(next);
  steveC.setAnimatedCount(next,prev);
  doFlash(false);
  showScoreBurst(next-prev);
  finishGate();
}

function finishGate(){
  segs[segIdx].done=true;
  // Poorten verdwijnen direct zodra de keuze verwerkt is.
  removeSceneObject(gateObj);
  gateObj=null;
  advanceSeg();
}

function retireSceneObject(obj,z){
  if(obj)retiredObjects.push({obj,z});
}

function cleanupRetiredObjects(){
  // De camera staat circa 20 units achter Steve. Pas daarna wordt het object
  // buiten beeld opgeruimd, zodat het vanzelf achter de speler verdwijnt.
  for(let i=retiredObjects.length-1;i>=0;i--){
    if(steveZ<retiredObjects[i].z-21){
      removeSceneObject(retiredObjects[i].obj);
      retiredObjects.splice(i,1);
    }
  }
}

function removeSceneObject(obj){
  if(!obj)return;
  scene.remove(obj);
  obj.traverse(child=>{
    child.geometry?.dispose();
    if(!child.userData.disposeOwn)return;
    if(child.material?.map)child.material.map.dispose();
    child.material?.dispose();
  });
}

function removeBattleBase(){
  const gateSeg=segs[Math.max(0,segIdx-1)];
  if(gateSeg?.baseObj){
    const base=gateSeg.baseObj;scene.remove(base);base.geometry.dispose();base.material.dispose();gateSeg.baseObj=null;
  }
}

// ═══════════════════════════════════════════════════
// SEGMENT LOGICA
// ═══════════════════════════════════════════════════
function advanceSeg(){
  segIdx++;
  if(segIdx>=segs.length){
    // Level gewonnen
    endLevel(true);
    return;
  }
  spawnSeg(segs[segIdx]);
}

function spawnSeg(seg){
  if(seg.type==='gate'){
    gateObj=seg.obj||buildGate(seg.z,seg.lop,seg.rop);
    seg.obj=null;
    gateLop=seg.lop; gateRop=seg.rop; gateZ=seg.z;
    phase='run';

    // Het obstakel van deze ronde staat al achter de Creepers klaar.
    // Vanaf het poortje is het daardoor in de verte zichtbaar en verschijnt
    // het niet pas nadat het gevecht is afgelopen.
    const roundObstacle=segs[segIdx+2];
    if(roundObstacle?.type==='obstacle'&&!roundObstacle.obj){
      roundObstacle.obj=buildObstacle(roundObstacle);
    }

    // Spawn creepers ALVAST op battleZ — zichtbaar terwijl je de poort nadert
    const maxFair=Math.max(1,Math.max(applyOp(seg.lop,steveC.count),applyOp(seg.rop,steveC.count))-1);
    const crN=seg.previewCrowd
      ?Math.min(seg.previewCrN,maxFair)
      :fairCreeperCount(seg.lop,seg.rop,steveC.count);
    seg.crN=crN;
    if(segs[segIdx+1]?.type==='battle')segs[segIdx+1].crCount=crN;
    if(seg.previewCrowd){
      // Neem de groep over die tijdens het obstakelgedeelte al in de verte stond.
      creeperC.rebuild(0);
      scene.remove(creeperC.group);
      creeperC=seg.previewCrowd;
      seg.previewCrowd=null;
      seg.previewBadge?.remove();seg.previewBadge=null;
      if(creeperC.count!==crN)creeperC.rebuild(crN);
      creeperC.setAnimatedCount(crN,crN);
    }else{
      creeperC.rebuild(crN);
      creeperC.setAnimatedCount(crN,crN);
    }
    creeperC.setPos(0, seg.battleZ);

    // Platform onder creepers
    if(!seg.baseObj)seg.baseObj=buildBattleBase(seg.battleZ);

  } else if(seg.type==='battle'){
    // Creepers zijn al gespawnd door het gate-segment
    // Stel alleen battle-state in
    phase='approach';
    gateObj=null; gateLop=null;
    // Zet de komende hindernis én de daaropvolgende poort nu al neer.
    // Zo worden ze op grote afstand zichtbaar en blijven ze stilstaan in de wereld.
    for(let i=1;i<=2;i++){
      const upcoming=segs[segIdx+i];
      if(!upcoming||upcoming.obj)continue;
      if(upcoming.type==='obstacle')upcoming.obj=buildObstacle(upcoming);
      if(upcoming.type==='gate')upcoming.obj=buildGate(upcoming.z,upcoming.lop,upcoming.rop);
    }
  } else if(seg.type==='obstacle'){
    obstacleObj=seg.obj||buildObstacle(seg);seg.obj=null;obstacleZ=seg.z;
    obstacleAnim=1;
    obstacleObj.position.set(seg.x,0,seg.z);
    obstacleObj.rotation.y=0;
    obstacleObj.scale.setScalar(1);
    phase='obstacle';

    // Bouw de volgende Creeper-groep nu al op grote afstand. De groep blijft
    // daar stilstaan totdat het bijbehorende poortje actief wordt.
    const nextGate=segs[segIdx+1];
    if(nextGate?.type==='gate'&&!nextGate.previewCrowd){
      const previewN=fairCreeperCount(nextGate.lop,nextGate.rop,steveC.count);
      const preview=new Crowd(false);
      preview.rebuild(previewN);
      preview.setAnimatedCount(previewN,previewN);
      preview.setPos(0,nextGate.battleZ);
      nextGate.previewCrowd=preview;
      nextGate.previewCrN=previewN;
      nextGate.previewSteveCount=steveC.count;
      if(!nextGate.baseObj)nextGate.baseObj=buildBattleBase(nextGate.battleZ);
    }
    const nextFinish=segs[segIdx+1];
    if(nextFinish?.type==='finish'&&!nextFinish.obj)nextFinish.obj=buildFinish(nextFinish.z);
  } else if(seg.type==='finish'){
    finishObj=seg.obj||buildFinish(seg.z);seg.obj=null;finishZ=seg.z;
    phase='finish';
  }
}

function buildBattleBase(z){
  const base=new THREE.Mesh(
    new THREE.CylinderGeometry(5,5,.15,24),
    new THREE.MeshLambertMaterial({color:0xff8a65,transparent:true,opacity:.4})
  );
  base.position.set(0,.8,z);
  base.userData.disposeOwn=true;
  scene.add(base);
  return base;
}

function startBattle(){
  phase='battle';
  bSt=steveC.count;
  bCr=creeperC.count;
  bTimer=0;
  battleCycle=0;battleImpactDone=false;battleResolving=false;
  battleDamage=Math.max(1,Math.ceil(Math.min(bSt,bCr)/3));
  battleZMid=(steveZ+creeperC.z)/2;
  tone(150,.18,'sawtooth',.055,1.6);tone(220,.16,'square',.04,1.35,.08);
}

function celebrateBattleWin(){
  soundVictory();
  const toast=document.getElementById('battle-toast');
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  for(let i=0;i<4;i++){
    spawnSplat(steveC.x+(Math.random()-.5)*4,steveC.z+(Math.random()-.5)*3,0xffd54f);
  }
}

// ═══════════════════════════════════════════════════
// BATTLE UPDATE — snelle aanvalsgolven tegen de hele Creeper-groep
// ═══════════════════════════════════════════════════
function tickBattle(dt){
  bTimer+=dt;battleCycle+=dt;
  // Beide kanten sluiten eerst aan bij het gevechtsfront.
  const moveEase=1-Math.exp(-5*dt);
  steveC.setPos(steveC.x,THREE.MathUtils.lerp(steveC.z,battleZMid+1.55,moveEase));
  creeperC.setPos(creeperC.x,THREE.MathUtils.lerp(creeperC.z,battleZMid-1.55,moveEase));

  // Contactmoment van iedere aanvalsgolf: zwaardflits, knockback en schade.
  if(!battleImpactDone&&battleCycle>=.13&&bSt>0&&bCr>0){
    battleImpactDone=true;
    soundSwordHit();
    const beforeCr=bCr;
    const damage=Math.min(battleDamage,bSt,bCr);
    bSt=Math.max(0,bSt-damage);bCr=Math.max(0,bCr-damage);
    const visibleAlive=creeperC.meshes.filter(m=>m.visible&&!m.userData.dying).length;
    const visualHits=bCr===0?visibleAlive:Math.max(1,Math.ceil(visibleAlive*damage/Math.max(1,beforeCr)));
    markBattleVictims(creeperC,visualHits,-1);
    if(bSt===0)markBattleVictims(steveC,1,1);
    spawnSwordArc(steveC.x-.85,battleZMid+.05);
    spawnSwordArc(steveC.x,battleZMid-.15);
    spawnSwordArc(steveC.x+.85,battleZMid+.05);
    cameraShake=Math.max(cameraShake,.24);
    for(let i=0;i<3;i++)spawnSplat((Math.random()-.5)*2,battleZMid+(Math.random()-.5),0xffd54f);
    creeperC.setAnimatedCount(bCr,creeperC.displayCount);
    steveC.setAnimatedCount(bSt,steveC.displayCount);
    if(bSt===0||bCr===0)battleResolving=true;
  }

  // Creepers rammen zichtbaar terug in de tweede helft van de golf.
  if(battleCycle>=.29&&battleCycle-dt<.29&&bSt>0&&bCr>0){
    soundCreeperRam();
    spawnSplat(steveC.x,battleZMid+1.0,0x8bc34a);
    cameraShake=Math.max(cameraShake,.13);
  }

  if(battleCycle>=.48){
    if(battleResolving){
      if(bSt>0){
      steveC.count=bSt;
      if(reductionPractice()){
        const restored=practiceStart();
        steveC.rebuild(restored);steveC.setAnimatedCount(restored,bSt);
        showMsg('Nieuwe ronde: '+restored,1100);
      }
      creeperC.rebuild(0);
      creeperC.setAnimatedCount(0,creeperC.displayCount);
      celebrateBattleWin();
      removeBattleBase();
      advanceSeg();
      }else{
      removeBattleBase();
      endLevel(false);
      }
      return;
    }
    battleCycle=0;battleImpactDone=false;
  }
}

function endLevel(win){
  gameOn=false;
  phase='done';
  if(win){
    document.getElementById('wst').textContent=bSt||steveC.count;
    document.getElementById('wlv').textContent=level;
    document.getElementById('wearn').textContent=(bSt||steveC.count)*level*2;
    document.getElementById('code-level').textContent=level+1;
    document.getElementById('earned-code').value=makeLevelCode(level+1,Math.max(1,bSt||steveC.count),mathSettings);
    document.getElementById('ws').classList.remove('hidden');
    level++;
  } else {
    soundDefeat();
    document.getElementById('lost-level').textContent=level;
    document.getElementById('ls').classList.remove('hidden');
  }
}

// ═══════════════════════════════════════════════════
// LEVEL START
// ═══════════════════════════════════════════════════
window.startGame=function(){
  unlockAudio();
  ['ss','ws','ls'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('lvnum').textContent=level;
  document.getElementById('pfill').style.width='0%';

  paused=false;
  document.getElementById('pause-label').classList.remove('show');
  document.getElementById('pause-btn').textContent='Ⅱ';
  K.l=K.r=false;
  battleVictims.length=0;
  swordArcs.splice(0).forEach(a=>{scene.remove(a);a.geometry.dispose();a.material.dispose();});
  steveX=0;targetX=0;steveZ=0;
  phase='run'; gameOn=true;
  runSpd=6.8+level*.28;

  const startN=reductionPractice()?practiceStart():Math.max(2,prevSteveCount>1?Math.ceil(prevSteveCount*.5):2);
  steveC.count=startN;steveC.rebuild(startN);steveC.setPos(0,0);
  steveC.displayCount=startN;steveC.countPulse=0;
  creeperC.rebuild(0);creeperC.displayCount=0;creeperC.countPulse=0;

  // Verwijder oude gate
  if(gateObj){removeSceneObject(gateObj);gateObj=null;}
  if(obstacleObj){removeSceneObject(obstacleObj);obstacleObj=null;}
  if(finishObj){removeSceneObject(finishObj);finishObj=null;}
  if(finishTimer){clearTimeout(finishTimer);finishTimer=null;}
  retiredObjects.splice(0).forEach(item=>removeSceneObject(item.obj));
  segs.forEach(seg=>{
    seg.previewBadge?.remove();seg.previewBadge=null;
    if(seg.previewCrowd){
      seg.previewCrowd.rebuild(0);
      scene.remove(seg.previewCrowd.group);
      seg.previewCrowd=null;
    }
    if(seg.obj){removeSceneObject(seg.obj);seg.obj=null;}
    if(seg.baseObj){const base=seg.baseObj;scene.remove(base);base.geometry.dispose();base.material.dispose();seg.baseObj=null;}
  });
  gateLop=null;gateRop=null;

  genLevel(level);
  segIdx=0;
  spawnSeg(segs[0]);

  // Hint weghalen na 5 sec
  setTimeout(()=>document.getElementById('hint').classList.add('gone'),5000);
};

window.nextLevel=function(){
  prevSteveCount=Math.max(1,bSt||steveC.count);
  steveC.count=prevSteveCount;
  window.startGame();
};
window.retryLevel=function(){
  prevSteveCount=1;steveC.count=1;
  window.startGame();
};

// ═══════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════
let lastTS=performance.now();
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTS)/1000,.05);
  lastTS=ts;
  const t=ts*.001;
  tickMusic();

  if(gameOn&&!paused){
    if(phase==='run'||phase==='approach'||phase==='obstacle'||phase==='finish'){
      footstepClock-=dt;
      if(footstepClock<=0){soundStep();footstepClock=.29;}
    }else footstepClock=0;
    if(phase==='run'||phase==='obstacle'||phase==='finish'){
      // Input sturen
      if(K.l) targetX-=10*dt;
      if(K.r) targetX+=10*dt;
      targetX=Math.max(-PAD_W+1.5,Math.min(PAD_W-1.5,targetX));
      steveX+=(targetX-steveX)*Math.min(1,8*dt);

      // Steve loopt vooruit
      steveZ-=runSpd*dt;
      steveC.setPos(steveX,steveZ);

      // Progress
      const totalZ=segs.length>0?Math.abs(segs[segs.length-1].z)+20:200;
      document.getElementById('pfill').style.width=(Math.min(1,Math.abs(steveZ)/totalZ)*100)+'%';

      if(phase==='run')checkGate();
      else if(phase==='obstacle')checkObstacle();
      else checkFinish();

    } else if(phase==='approach'){
      // Steve loopt naar creepers toe maar stopt op afstand
      if(K.l) targetX-=8*dt;
      if(K.r) targetX+=8*dt;
      targetX=Math.max(-PAD_W+1.5,Math.min(PAD_W-1.5,targetX));
      steveX+=(targetX-steveX)*Math.min(1,8*dt);

      // Na het poortje dezelfde loopsnelheid vasthouden tot aan het gevecht.
      const stopDist=6;
      const distToEnemy=Math.abs(creeperC.z-steveZ);
      if(distToEnemy>stopDist){
        steveZ-=runSpd*dt;
      } else {
        // Start battle!
        startBattle();
      }
      steveC.setPos(steveX,steveZ);

    } else if(phase==='battle'){
      tickBattle(dt);
    }
    // pause: niks doen, wacht op setTimeout
  }

  const animationMode=gameOn&&!paused?phase:'idle';
  steveC.animate(t,dt,animationMode);
  creeperC.animate(t,dt,animationMode);
  steveC.tickCounter(dt);
  creeperC.tickCounter(dt);
  animateObstacleSpawn(dt);
  cleanupRetiredObjects();
  tickSplats(dt);
  tickBattleEffects(dt);
  tickExplosions(dt);
  waterMat.map.offset.set(t*.035,t*.018);
  waterFall=Math.max(0,waterFall-dt);
  steveC.group.position.y=-Math.sin(waterFall/.75*Math.PI)*1.1;
  updateCamera(dt);
  updateBadgePos();
  renderer.render(scene,camera);
}

loop(performance.now());
</script>
